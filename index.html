<style>
/* Layout: phone-first hub, one column of game cards; each game opens full-width with a back bar. */
:root{
  --bg:#F6F3EA; --panel:#FFFFFF; --ink:#1B2A28; --muted:#5D6B68; --line:#DDD6C6; --soft:#EEE8DA;
  --mean:#0B6E5F; --mean-soft:#DDEFE9; --gold:#A86A12; --gold-soft:#F6EAD2; --ok:#1B8A5A; --bad:#C23A2B;
  --t1:#0B6E5F; --t2:#A86A12; --t3:#7A4FB5; --t4:#C2410C; --on-accent:#FFFFFF;
  --display:"Bricolage Grotesque","Vazirmatn","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1817; --panel:#172321; --ink:#E8EFEC; --muted:#9AAAA6; --line:#2A3936; --soft:#1D2B28;
  --mean:#4FC3A9; --mean-soft:#173A33; --gold:#E8B04A; --gold-soft:#3A2E17; --ok:#4CC98D; --bad:#FF7A6B;
  --t1:#4FC3A9; --t2:#E8B04A; --t3:#B394F0; --t4:#F08A55; --on-accent:#0F1817; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1817; --panel:#172321; --ink:#E8EFEC; --muted:#9AAAA6; --line:#2A3936; --soft:#1D2B28;
  --mean:#4FC3A9; --mean-soft:#173A33; --gold:#E8B04A; --gold-soft:#3A2E17; --ok:#4CC98D; --bad:#FF7A6B;
  --t1:#4FC3A9; --t2:#E8B04A; --t3:#B394F0; --t4:#F08A55; --on-accent:#0F1817; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:38px;height:38px;flex:none}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.accent{background:var(--mean-soft);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.chip{font:inherit;font-size:.88rem;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--mean);background:var(--mean);color:var(--on-accent)}
.tag{font-family:var(--mono);font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.star{background:var(--gold-soft);color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--mean);outline-offset:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--mean);color:var(--on-accent);font-size:1rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);font-weight:500;font-size:.92rem;padding:10px 14px}
.btn.gold{background:var(--gold);color:var(--on-accent)}
input[type=search],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-weight:500;font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{text-align:start;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard:hover{border-color:var(--mean)}
.gcard .gpic{font-size:2rem;line-height:1}
.gcard p{font-size:.88rem;color:var(--muted)}
.gcard .best{font-family:var(--mono);font-size:.75rem;color:var(--ok)}
.gcard.occ{background:var(--gold-soft);border-color:transparent}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{font:inherit;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.stem{font-size:1.05rem}
.bigpic{font-size:4.2rem;line-height:1.1;text-align:center}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;text-align:start;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:1rem}
.choice:hover:not([disabled]){border-color:var(--mean)}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--panel))}
.choice.done{opacity:.4}
.choice[disabled]{cursor:default}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles .choice{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:16px 10px;min-height:110px;font-size:1.05rem;font-weight:600}
.tiles .choice .pic{font-size:2.6rem;line-height:1}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seq{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.seq li{display:flex;gap:10px;align-items:center;background:var(--mean-soft);border-radius:10px;padding:8px 12px}
.seq li b{font-family:var(--mono);color:var(--mean)}
.feedback{border-inline-start:4px solid var(--ok);padding:10px 12px;background:var(--bg);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.feedback.no{border-inline-start-color:var(--bad)}
.ref{font-size:.82rem;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:24px;height:7px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--mean)}
.stars{font-size:2rem;letter-spacing:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}
/* class host mode: readable from the back of a room */
.host .hostq{font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1.25}
.host .choice{font-size:1.2rem;padding:14px 16px}
.host .choice .let{font-family:var(--mono);font-weight:600;color:var(--mean);margin-inline-end:10px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.score{border-radius:12px;padding:8px 12px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:8px;border-inline-start:6px solid var(--line)}
.score b{font-family:var(--mono);font-size:1.3rem}
@media (min-width:900px){.wrap.wide{max-width:1000px}.host .hostq{font-size:2.2rem}.host .choice{font-size:1.5rem}.host .bigpic{font-size:6rem}}
@media (max-width:440px){h1{font-size:1.95rem}.games{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.host .hostq{font-size:1.35rem}}
/* right-to-left (Farsi) */
[dir="rtl"] body{font-family:"Vazirmatn",var(--body)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:"Vazirmatn",var(--display)}
[dir="rtl"] .eyebrow,[dir="rtl"] .tag{letter-spacing:0;text-transform:none;font-family:"Vazirmatn",var(--body)}
[dir="rtl"] ul,[dir="rtl"] ol{padding-left:0!important;padding-right:20px!important}
.num,.stat b{direction:ltr}
[dir="rtl"] .choice{unicode-bidi:plaintext}
</style>

<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>(function(){var c=(window.SS_CONFIG||{}).analyticsCode;if(c&&/^[a-z0-9-]+$/.test(c)){var s=document.createElement("script");s.async=true;s.src="https://gc.zgo.at/count.js";s.setAttribute("data-goatcounter","https://"+c+".goatcounter.com/count");document.head.appendChild(s)}})();</script>
<script src="dict.js"></script>
<script>
/* ================= Translation layer =================
   Visible text is looked up by its English wording, numbers replaced by {0}, {1}…
   A sentence that mixes plain text with bold/italic words is translated as one unit:
   inline elements become <0>…</0>, <1>…</1> and untranslatable names become [[0]], [[1]].
   Dictionaries: window.SS_DICT = {fa:{...}}. Missing entries stay in English. */
(function(){
const A = window.APP || (window.APP = {});
const LANGS = [{id:"en",name:"English"},{id:"fa",name:"فارسی",rtl:true}];
A.LANGS = LANGS.filter(l=>l.id==="en"||(window.SS_DICT&&window.SS_DICT[l.id]&&Object.keys(window.SS_DICT[l.id]).length));
let lang = "";
try{ lang = JSON.parse(localStorage.getItem("ild.lang")) || ""; }catch(e){ lang = ""; }
if(!A.LANGS.some(l=>l.id===lang)){
  const nav = ((navigator.languages&&navigator.languages[0])||navigator.language||"en").toLowerCase();
  lang = nav.startsWith("fa")?"fa":"en";
  if(!A.LANGS.some(l=>l.id===lang)) lang="en";
}
A.lang = lang;
A.setLang = id => { try{localStorage.setItem("ild.lang",JSON.stringify(id))}catch(e){} location.reload(); };
const L = LANGS.find(l=>l.id===lang);
document.documentElement.lang = lang;
document.documentElement.dir = L.rtl?"rtl":"ltr";

const NUM = /[-−]?\d+(?:[.,]\d+)*%?/g;
const dict = (window.SS_DICT && window.SS_DICT[lang]) || {};
const capture = window.SS_CAPTURE || null;
const INLINE = new Set(["STRONG","EM","B","I","SPAN","SUB","SUP","CODE","BR"]);
const SKIP = new Set(["SCRIPT","STYLE","TEXTAREA"]);
const hasLetters = s => /[A-Za-z]/.test(s);

function lookup(key){ if(capture) capture.add(key); if(lang==="en") return null; const d=dict[key]; return d==null?null:d; }
function fill(tpl,nums){ return tpl.replace(/\{(\d+)\}/g,(_,i)=>nums[+i]!=null?nums[+i]:""); }

/* plain text */
function translate(s){
  const t = s.replace(/\s+/g," ").trim();
  if(!t) return null;
  const nums = [];
  const key = t.replace(NUM, m => { nums.push(m); return "{"+(nums.length-1)+"}"; });
  if(!hasLetters(key)) return null;
  const d = lookup(key);
  if(d==null) return null;
  return s.match(/^\s*/)[0] + fill(d,nums) + s.match(/\s*$/)[0];
}
A.tr = s => translate(String(s)) ?? String(s);

/* mixed sentence */
const isNo = el => el.getAttribute && el.getAttribute("translate")==="no";
function unitOK(el){
  if(INLINE.has(el.nodeName) || SKIP.has(el.nodeName) || isNo(el)) return false;
  let text=false, elem=false;
  for(const c of el.childNodes){
    if(c.nodeType===3){ if(c.data.trim()) text=true; }
    else if(c.nodeType===1){
      if(!INLINE.has(c.nodeName)) return false;
      if(!isNo(c) && c.nodeName!=="BR") for(const g of c.childNodes) if(g.nodeType!==3) return false;
      elem=true;
    } else if(c.nodeType!==8) return false;
  }
  return text && elem;
}
const units = new WeakMap();
function doUnit(el){
  if(units.get(el)===el.innerHTML) return true;
  const nums=[], parts=[], inl=[], keep=[];
  const norm = s => s.replace(NUM, m => { nums.push(m); return "{"+(nums.length-1)+"}"; });
  for(const c of el.childNodes){
    if(c.nodeType===3) parts.push(norm(c.data));
    else if(c.nodeType===1){
      if(c.nodeName==="BR"){ parts.push("<br>"); }
      else if(isNo(c)){ keep.push(c); parts.push("[["+(keep.length-1)+"]]"); }
      else { inl.push(c); parts.push("<"+(inl.length-1)+">"+norm(c.textContent)+"</"+(inl.length-1)+">"); }
    }
  }
  const key = parts.join("").replace(/\s+/g," ").trim();
  if(!hasLetters(key.replace(/<\/?\d+>|\[\[\d+\]\]|<br>/g,""))){ units.set(el,el.innerHTML); return true; }
  const d = lookup(key);
  if(d==null){ units.set(el,el.innerHTML); return !!capture; }
  const frag = document.createDocumentFragment();
  const re = /<(\d+)>([\s\S]*?)<\/\1>|\[\[(\d+)\]\]|<br>/g; let last=0, m;
  const txt = s => { if(s) frag.appendChild(document.createTextNode(fill(s,nums))); };
  while((m=re.exec(d))){
    txt(d.slice(last,m.index));
    if(m[1]!=null){ const o=inl[+m[1]]; if(o){ const n=o.cloneNode(false); n.textContent=fill(m[2],nums); frag.appendChild(n); } }
    else if(m[3]!=null){ const o=keep[+m[3]]; if(o) frag.appendChild(o.cloneNode(true)); }
    else frag.appendChild(document.createElement("br"));
    last = re.lastIndex;
  }
  txt(d.slice(last));
  el.textContent=""; el.appendChild(frag);
  units.set(el,el.innerHTML);
  return true;
}

const seen = new WeakMap();
function doText(n){
  if(seen.get(n)===n.data) return;
  const p = n.parentNode;
  if(p && (SKIP.has(p.nodeName) || (p.closest && p.closest("[translate=no]")))) return;
  if(p && p.nodeType===1 && unitOK(p)){ if(doUnit(p)) return; }
  if(p && p.parentNode && p.parentNode.nodeType===1 && INLINE.has(p.nodeName) && unitOK(p.parentNode)){ if(doUnit(p.parentNode)) return; }
  const r = translate(n.data);
  if(r!=null){ seen.set(n,r); n.data = r; } else seen.set(n,n.data);
}
function doAttrs(el){
  for(const a of ["placeholder","aria-label","title"]){
    if(el.hasAttribute && el.hasAttribute(a)){ const v=el.getAttribute(a), r=translate(v); if(r!=null && r!==v) el.setAttribute(a,r); }
  }
}
function walk(node){
  if(!node) return;
  if(node.nodeType===3){ doText(node); return; }
  if(node.nodeType===11){ for(const c of [...node.childNodes]) walk(c); return; }
  if(node.nodeType!==1 || SKIP.has(node.nodeName) || isNo(node)) return;
  doAttrs(node);
  if(unitOK(node) && doUnit(node)) return;
  for(const c of [...node.childNodes]) walk(c);
}
A.translateTree = walk;
function start(){
  walk(document.body);
  new MutationObserver(ms=>{ for(const m of ms){ if(m.type==="characterData") doText(m.target); else m.addedNodes.forEach(walk); } })
    .observe(document.body,{subtree:true,childList:true,characterData:true});
}
if(document.body) start(); else document.addEventListener("DOMContentLoaded",start);
})();

/* ================= iLearnDeen core ================= */
(function(){
const A = window.APP = Object.assign(window.APP||{}, {games:[], sets:[], occasions:[]});
A.reg = g => A.games.push(g);

/* ---------- units, age bands, teams ---------- */
A.UNITS = {
  u1:{name:"Knowing Allah and our beliefs"},
  u2:{name:"Worship in practice"},
  u3:{name:"The 14 Maʿṣūmīn"},
  u4:{name:"Stories of the Prophets"},
  u5:{name:"The Qur'an, duʿā and the Islamic year"},
  u6:{name:"Good character"}
};
A.BANDS = [{id:"k2",name:"Little",yrs:"K–2"},{id:"35",name:"Middle",yrs:"Years 3–5"},{id:"69",name:"Older",yrs:"Years 6–9"}];
A.bandName = id => {const b=A.BANDS.find(x=>x.id===id);return b?`${b.name} (${b.yrs})`:"All ages"};
A.TEAMS = [{id:"noor",name:"Team Noor",c:"var(--t1)"},{id:"sabr",name:"Team Ṣabr",c:"var(--t2)"},{id:"sidq",name:"Team Ṣidq",c:"var(--t3)"},{id:"shukr",name:"Team Shukr",c:"var(--t4)"}];

/* ---------- random helpers ---------- */
const S = A.S = {};
S.r = Math.random;
S.int = (a,b) => a + Math.floor(S.r()*(b-a+1));
S.pick = arr => arr[Math.floor(S.r()*arr.length)];
S.shuffle = arr => {const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(S.r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- utils ---------- */
A.esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
A.h = (tag,attrs={},html="") => {const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k])}e.innerHTML=html;return e};
const store = A.store = {get(k,d){try{const v=localStorage.getItem("ild."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("ild."+k,JSON.stringify(v))}catch(e){}}};
let toastT; A.toast = msg => {const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)};
A.best = store.get("best",{});
A.band = store.get("band","all");
A.inBand = bands => A.band==="all"||!bands||bands.includes(A.band);

/* ---------- usage counts (GoatCounter, optional) ---------- */
const trackQ=[];let trackT=null,trackTries=0;
const trackOn=()=>!!(window.SS_CONFIG&&window.SS_CONFIG.analyticsCode);
const trackFlush=()=>{if(window.goatcounter&&window.goatcounter.count){while(trackQ.length){try{window.goatcounter.count(trackQ.shift())}catch(e){}}clearInterval(trackT);trackT=null}else if(++trackTries>40){trackQ.length=0;clearInterval(trackT);trackT=null}};
A.track = (path,title) => {if(!trackOn()&&!(window.goatcounter&&window.goatcounter.count))return;trackQ.push({path,title:title||path,event:true});if(trackQ.length>50)trackQ.shift();trackFlush();if(trackQ.length&&!trackT){trackTries=0;trackT=setInterval(trackFlush,500)}};
A.award = (gameId,points,max) => {
  A.track("finish/"+gameId);
  const prev=A.best[gameId];
  if(!prev||points>prev.points){A.best[gameId]={points,max};store.set("best",A.best)}
};
A.fbUrl = () => ((window.SS_CONFIG||{}).feedbackUrl||"");

/* ---------- hints ---------- */
A.curHints=[];
A.hintUI=(box,penalty,onUse,given)=>{const hs=given||A.curHints||[];if(!hs.length)return;let k=0;
  const wrap=A.h("div",{class:"hintwrap",style:"display:flex;flex-direction:column;gap:8px"},`<button class="btn ghost hintbtn" type="button" style="align-self:flex-start">Show a hint${penalty?" (half points for this question)":""}</button><div class="hints"></div>`);
  box.appendChild(wrap);const btn=wrap.querySelector(".hintbtn"),list=wrap.querySelector(".hints");
  btn.addEventListener("click",()=>{if(k>=hs.length)return;if(k===0&&onUse)onUse();list.insertAdjacentHTML("beforeend",`<p class="hint" style="background:var(--mean-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.92rem"><strong>Hint ${k+1}:</strong> ${A.esc(hs[k])}</p>`);k++;btn.textContent=k<hs.length?"Another hint":"No more hints";if(k>=hs.length)btn.disabled=true})};

/* a shuffled deck that deals n items per round and reshuffles when it runs out */
A.deck = arr => {let d=S.shuffle(arr),p=0;return {take:n=>{const out=[];for(let k=0;k<n;k++){if(p>=d.length){d=S.shuffle(arr);p=0}out.push(d[p++])}return out}}};
A.mc = (choices,answer) => {const idx=S.shuffle(choices.map((_,k)=>k));return {choices:idx.map(k=>choices[k]),answer:idx.indexOf(answer)}};
const choiceHTML = c => typeof c==="object"?`<span class="pic" aria-hidden="true">${c.pic}</span><span>${c.label}</span>`:c;
const starsHTML = (score,max) => {const n=Math.max(1,Math.round(score/max*5));return `<div class="stars" aria-label="${n} of 5 stars">${"⭐".repeat(n)}${"☆".repeat(5-n)}</div>`};
const endMsg = (score,max) => score>=max*0.8?"Excellent work, mā shāʾ Allāh!":score>=max*0.5?"Good effort! Play again to remember even more.":"Nice try! Read the answers again, then play another round.";

/* ---------- question banks ----------
   Item: {b:["k2","35","69"], pic?, q, c:[correct, wrong, wrong], e (explanation), ref?}
   Choices may be strings or {pic,label} tiles. The first choice is the correct one; it is shuffled on display
   unless the item has keep:true. */
A.pickBand = (bank,band) => {const b=band||A.band;let l=b==="all"?bank:bank.filter(q=>q.b.includes(b));return l.length?l:bank};
A.asQ = it => {const m=it.keep?{choices:it.c,answer:it.a||0}:A.mc(it.c,it.a||0);return {pic:it.pic,hint:it.h,html:`<p>${it.q}</p>`,choices:m.choices,answer:m.answer,explain:`<p>${it.e}</p>`+(it.ref?`<p class="ref">${it.ref}</p>`:"")}};
/* a question set that games, occasions and class host mode can all draw from */
A.addSet = set => {const decks={};set.take=set.take||((band,n)=>{const k=band||"all";if(!decks[k])decks[k]=A.deck(A.pickBand(set.bank,k));return decks[k].take(n)});A.sets.push(set);return set};
A.bankQuiz = (el,cfg) => {const set=cfg.set;let order=[];A.quiz(el,{id:cfg.id,n:cfg.n||5,intro:cfg.intro,onStart(){order=set.take(A.band,cfg.n||5)},gen:i=>A.asQ(order[i])})};

/* ---------- quiz engine ----------
   cfg: {id, n, points=10, intro?, onStart?(), gen(i) -> {pic?, role?, html, choices[], answer, explain}}
   multi-step: gen returns {html, steps:[{html, choices, answer, explain}, …]} */
A.quiz = (el,cfg) => {
  const pts=cfg.points||10;let hinted=false,i=0,score=0,res=[],q=null,step=0;
  const box=A.h("div",{class:"card"});el.appendChild(box);
  const start=()=>{if(cfg.onStart)cfg.onStart();i=0;score=0;res=[];next()};
  const next=()=>{q=cfg.gen(i);step=0;q._miss=false;draw()};
  const cur=()=>q.steps?q.steps[step]:q;
  function draw(){
    const s=cur(),tiles=s.choices.some(c=>typeof c==="object");
    box.innerHTML=`<div class="row between"><div class="dots">${Array.from({length:cfg.n},(_,k)=>`<i class="${k<res.length?(res[k]?"ok":"no"):k===i?"cur":""}"></i>`).join("")}</div><span class="num lead">${score} pts</span></div>`+
      (q.role?`<span class="tag">Your role: ${A.esc(q.role)}</span>`:"")+
      (step===0&&q.pic?`<div class="bigpic" aria-hidden="true">${q.pic}</div>`:"")+
      (step===0&&q.html?`<div class="stem">${q.html}</div>`:"")+(s.html&&q.steps?`<div class="stem">${s.html}</div>`:"")+
      `<div class="${tiles?"tiles"+(s.choices.length===3?" three":""):"choices"}">${s.choices.map((c,k)=>`<button class="choice" data-k="${k}">${choiceHTML(c)}</button>`).join("")}</div><div class="fb"></div>`;
    box.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
    hinted=false;const hl=s.hint?[s.hint]:(step===0&&q.hint?[q.hint]:[]);A.hintUI(box.querySelector(".fb").parentNode.insertBefore(A.h("div"),box.querySelector(".fb")),true,()=>{hinted=true},hl);
  }
  function answer(k){
    const s=cur(),ok=k===s.answer;
    box.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(j===s.answer)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
    const last=!q.steps||step===q.steps.length-1;
    const hw=box.querySelector(".hintwrap .hintbtn");if(hw)hw.disabled=true;
    if(ok)score+=Math.round((q.steps?pts/q.steps.length:pts)*(hinted?0.5:1));
    if(!ok)q._miss=true;
    const fb=box.querySelector(".fb");
    fb.innerHTML=`<div class="feedback ${ok?"":"no"}"><p><strong>${ok?"Well done!":"Not quite."}</strong></p>${s.explain||""}</div><div class="row" style="margin-top:10px"><button class="btn" id="qn">${last?(i===cfg.n-1?"See results":"Next"):"Continue"}</button></div>`;
    box.querySelector("#qn").addEventListener("click",()=>{
      if(!last){step++;draw();return}
      res.push(!q._miss);i++;
      if(i<cfg.n)next();else finish();
    });
    fb.scrollIntoView&&fb.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
  function finish(){
    const max=cfg.n*pts;A.award(cfg.id,score,max);
    box.innerHTML=`${starsHTML(score,max)}<h2>${score} / ${max} points</h2><p class="lead">${endMsg(score,max)}</p><p class="lead" style="font-size:.85rem">Best scores are saved on this device.</p><div class="row"><button class="btn" id="again">Play another round</button></div>`;
    box.querySelector("#again").addEventListener("click",start);
  }
  if(cfg.intro){box.innerHTML=`<p>${cfg.intro}</p><div class="row"><button class="btn" id="go">Start</button></div>`;box.querySelector("#go").addEventListener("click",start)}else start();
};
/* Tap engine for the youngest players: the same quiz with big picture tiles */
A.tap = (el,cfg) => A.quiz(el,cfg);

/* ---------- rounds engine (hands-on games with custom scoring) ----------
   cfg: {id, n, max, onStart?(), render(body, api)}  api: {round, add(points), next()} */
A.rounds = (el,cfg) => {
  let r=0,score=0,rh=null;const box=A.h("div",{class:"card"});el.appendChild(box);
  const api={get round(){return r},add:p=>{score+=p},get score(){return score},setHints:l=>{rh=l},
    next:()=>{r++;if(r<cfg.n)paint();else{const max=cfg.n*cfg.max,sc=Math.round(score);A.award(cfg.id,sc,max);box.innerHTML=`${starsHTML(sc,max)}<h2>${sc} / ${max} points</h2><p class="lead">${endMsg(sc,max)}</p><p class="lead" style="font-size:.85rem">Best scores are saved on this device.</p><div class="row"><button class="btn" id="again">Play another round</button></div>`;box.querySelector("#again").addEventListener("click",()=>{r=0;score=0;if(cfg.onStart)cfg.onStart();paint()})}}};
  const paint=()=>{box.innerHTML=`<div class="row between"><span class="eyebrow">Round ${r+1} of ${cfg.n}</span><span class="num lead">${Math.round(score)} pts</span></div><div class="body" style="display:flex;flex-direction:column;gap:12px"></div><div class="hb"></div>`;rh=null;cfg.render(box.querySelector(".body"),api);A.hintUI(box.querySelector(".hb"),false,null,rh||A.curHints)};
  if(cfg.onStart)cfg.onStart();paint();
};
/* Ordering helper used by rounds games: tap items in the right order.
   After 3 wrong taps the right order is shown, so young players never get stuck. */
A.orderTask = (body,api,{prompt,items,max=10,explain=""}) => {
  let pos=0,miss=0;const sh=S.shuffle(items.map((_,k)=>k));
  body.innerHTML=`<p class="stem"><strong>${prompt}</strong></p><ol class="seq"></ol><div class="choices">${sh.map(k=>`<button class="choice" data-k="${k}">${items[k]}</button>`).join("")}</div><div class="fb"></div>`;
  const seq=body.querySelector(".seq"),fb=body.querySelector(".fb");
  const add=k=>{seq.insertAdjacentHTML("beforeend",`<li><b>${k+1}</b><span>${items[k]}</span></li>`)};
  const end=shown=>{body.querySelectorAll(".choice").forEach(b=>b.disabled=true);const p=shown?0:Math.max(0,max-2*miss);api.add(p);
    fb.innerHTML=`<div class="feedback ${shown?"no":""}"><p><strong>${shown?"Here is the right order.":miss?"Well done! You got there.":"Perfect order!"}</strong> +${p} points</p>${explain}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">Next</button></div>`;
    body.querySelector("#nx").addEventListener("click",api.next)};
  body.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{const k=+b.dataset.k;
    if(k===pos){b.disabled=true;b.classList.add("done");add(k);pos++;if(pos===items.length)end(false)}
    else{miss++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");if(miss>=3){for(let j=pos;j<items.length;j++)add(j);end(true)}}}));
};

/* One multiple-choice question inside a rounds game, with its own hint. */
A.askTask = (body,api,q,pts=10) => {
  api.setHints(q.hint?[q.hint]:[]);
  const tiles=q.choices.some(c=>typeof c==="object");
  body.innerHTML=`${q.pic?`<div class="bigpic" aria-hidden="true">${q.pic}</div>`:""}<div class="stem">${q.html}</div><div class="${tiles?"tiles"+(q.choices.length===3?" three":""):"choices"}">${q.choices.map((c,j)=>`<button class="choice" data-j="${j}">${choiceHTML(c)}</button>`).join("")}</div><div class="fb"></div>`;
  body.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{const j=+b.dataset.j,ok=j===q.answer;
    body.querySelectorAll(".choice").forEach((x,k)=>{x.disabled=true;if(k===q.answer)x.classList.add("right");else if(k===j)x.classList.add("wrong")});
    if(ok)api.add(pts);
    body.querySelector(".fb").innerHTML=`<div class="feedback ${ok?"":"no"}"><p><strong>${ok?"Well done!":"Not quite."}</strong></p>${q.explain}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">Next</button></div>`;
    body.querySelector("#nx").addEventListener("click",api.next)}));
};
/* question-bank item: b = bands, c[0] = correct answer, h = hint for this question */
A.Q = (b,pic,q,c,e,ref,h) => ({b,pic,q,c,e,ref,h});
A.T = (pic,label) => ({pic,label});

let starRot=null,filter=store.get("filter","all"),query="",cleanup=null,view="home";
const app=document.getElementById("app");
const bandTags = g => (g.bands||[]).map(b=>`<span class="tag">${A.esc(A.BANDS.find(x=>x.id===b).yrs)}</span>`).join("");
function unitTags(g){return g.units.map(([u,l])=>`<span class="tag">${A.esc(A.UNITS[u].name)} · Outcome ${l.join(", ")}</span>`).join("")}
function footer(){const c=window.SS_CONFIG;if(!c)return "";const y=new Date().getFullYear();
  return `<footer class="row" style="justify-content:center;gap:16px;font-size:.82rem;color:var(--muted);padding-top:8px"><span>© ${y>2026?"2026–"+y:"2026"} ${A.esc(c.owner||"")}. All rights reserved.</span>${c.installable?`<a href="#home" id="showinst" style="color:var(--muted)">How to install</a>`:""}${c.pages?`<a href="about.html" style="color:var(--muted)">About &amp; sources</a><a href="privacy.html" style="color:var(--muted)">Privacy</a>`:""}${A.fbUrl()?`<a href="${A.esc(A.fbUrl())}" target="_blank" rel="noopener" style="color:var(--muted)">Send feedback (parents and teachers)</a>`:""}<span>Free beta ${A.esc(c.version||"")}</span></footer>`}

    <div class="brand">${STAR}<h1 translate="no">iLearnDeen</h1></div>
    <p class="lead">Short games about our faith for children from Kindy to Year 9. Play at home, in class or at community programs.</p>
    <div class="row"><button class="btn" id="quick">Play a quick game</button><span class="lead" style="font-size:.85rem">About 2 minutes</span></div>
  </header>
  <section class="card"><h2>Who is playing?</h2>
    <div class="seg" role="group" aria-label="Age group"><button class="chip" data-band="all" aria-pressed="${A.band==="all"}">All ages</button>${A.BANDS.map(b=>`<button class="chip" data-band="${b.id}" aria-pressed="${A.band===b.id}">${b.name} · ${b.yrs}</button>`).join("")}</div>
    <p class="lead" style="font-size:.85rem">${A.band==="all"?"Showing games for every age.":`Showing games for ${A.esc(A.bandName(A.band))}.`}</p></section>
  ${installCard()}
  ${occs.length?`<section class="card"><h2>Occasions</h2><p class="lead">Ready-made questions for special days and community programs.</p>
    <div class="games">${occs.map(o=>`<button class="gcard occ" data-occ="${o.id}"><span class="gpic" aria-hidden="true">${o.pic}</span><span class="tag star" style="align-self:flex-start">${A.esc(o.date)}</span><h3>${A.esc(o.title)}</h3><p>${A.esc(o.blurb)}</p></button>`).join("")}</div>
    <p class="lead" style="font-size:.85rem">More occasions are coming: 13 Rajab, Eid al-Ghadīr, Ramaḍān and more.</p></section>`:""}
  <section class="card accent"><h2>Teaching a class?</h2><p>Show the questions on a TV or projector. Children answer out loud in teams, and you tap who got it right.</p><button class="btn" id="hostbtn" style="align-self:flex-start">Open class host mode</button></section>
  <section class="card"><h2>Your progress</h2><div class="stats"><div class="stat"><b>${Object.keys(A.best).filter(k=>A.games.some(g=>g.id===k)).length} / ${A.games.length}</b><span>games played</span></div><div class="stat"><b>${A.games.reduce((a,g)=>a+(A.best[g.id]?A.best[g.id].points:0),0)}</b><span>total best points</span></div><div class="stat"><b>${Object.values(A.best).filter(b=>b.points>=b.max*0.8).length}</b><span>top scores</span></div></div></section>
  <section class="card"><h2>Games</h2>
    <input type="search" id="q" placeholder="Search games, e.g. wuḍūʾ, Prophets, Imams" value="${A.esc(query)}" aria-label="Search games">
    <div class="row" id="filters"><button class="chip" data-f="all" aria-pressed="${filter==="all"}">All units</button>${Object.entries(A.UNITS).filter(([k])=>A.games.some(g=>g.units.some(u=>u[0]===k))).map(([k,u])=>`<button class="chip" data-f="${k}" aria-pressed="${filter===k}">${u.name}</button>`).join("")}</div></section>

  const si=app.querySelector("#showinst");if(si)si.addEventListener("click",e=>{e.preventDefault();store.set("installHidden",false);renderHome();window.scrollTo(0,0)});

  const di=app.querySelector("#doinst");if(di)di.addEventListener("click",async()=>{const e=A.installEvt;if(!e)return;e.prompt();try{await e.userChoice}catch(x){}A.installEvt=null;renderHome()});
  app.querySelector("#quick").addEventListener("click",()=>{const pool=A.games.filter(g=>g.star&&A.inBand(g.bands)).map(g=>g.id);const all=pool.length?pool:A.games.filter(g=>g.star).map(g=>g.id);const fresh=all.filter(id=>!A.best[id]);A.track("quick-play");location.hash=S.pick(fresh.length?fresh:all)});

  app.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.lang!==A.lang)A.setLang(b.dataset.lang)}));
  app.querySelectorAll("[data-band]").forEach(b=>b.addEventListener("click",()=>{A.band=b.dataset.band;store.set("band",A.band);A.track("band/"+A.band);renderHome()}));

}
function topbar(label){return `<div class="topbar"><button class="back" id="back">← Home</button><span class="eyebrow">${label}</span></div>`}
function bindBack(){app.querySelector("#back").addEventListener("click",()=>{location.hash="home"})}
function markPlay(id){let played=false;const stg=app.querySelector("#stage");const mark=e=>{if(played)return;const b=e.target.closest&&e.target.closest("button");if(!b||b.classList.contains("hintbtn")||b.id==="go"||b.id==="again")return;played=true;A.track("play/"+id)};stg.addEventListener("click",mark)}

/* ---------- occasions ---------- */
/* A.addOccasion({id, title, date, pic, blurb, about, bank, mix}) — mix = a general akhlāq bank;
   each draw is about 60% occasion questions and 40% general questions. */
A.addOccasion = o => {const d1={},d2={};
  const take=(band,n)=>{const k=band||"all";if(!d1[k])d1[k]=A.deck(A.pickBand(o.bank,k));if(!d2[k])d2[k]=A.deck(A.pickBand(o.mix,k));const m=o.mix&&o.mix.length?Math.floor(n*0.4):0;return S.shuffle(d1[k].take(n-m).concat(m?d2[k].take(m):[]))};
  A.occasions.push(o);A.addSet({id:o.id,title:o.title+" ("+o.date+")",occ:true,bank:o.bank.concat(o.mix||[]),take});return o};
function renderOcc(o){

    ["band","teams","n"].forEach(k=>app.querySelectorAll(`[data-${k}]`).forEach(b=>b.addEventListener("click",()=>{const v=b.dataset[k];cfg[k]=k==="band"?v:+v;app.querySelectorAll(`[data-${k}]`).forEach(x=>x.setAttribute("aria-pressed",String(x===b)))})));

  }
  function play(){
    const set=A.sets.find(s=>s.id===cfg.set);const items=set.take(cfg.band,cfg.n).map(A.asQ);

    A.track("host/"+set.id);

        fb.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"))));
        fb.querySelector("#hnext").addEventListener("click",()=>{fb.querySelectorAll('[data-t][aria-pressed="true"]').forEach(b=>teams[+b.dataset.t].pts+=10);i++;if(i<items.length)draw();else end()});
      })};
    const end=()=>{const top=Math.max(...teams.map(t=>t.pts));const win=teams.filter(t=>t.pts===top&&top>0);
      app.innerHTML=`${topbar(A.esc(set.title))}<section class="card host"><div class="bigpic" aria-hidden="true">🎉</div><h1 style="font-size:2rem;text-align:center">${win.length===1?`${win[0].name} has the most points!`:win.length?"It's a tie!":"Well played, everyone!"}</h1>${board()}<p class="lead" style="text-align:center">Well done, everyone. What matters most is what we learned together.</p>
        <div class="row" style="justify-content:center"><button class="btn" id="hagain">Play again</button><button class="btn ghost" id="hset2">Change settings</button></div></section>`;
      bindBack();A.track("host-finish/"+set.id);
      app.querySelector("#hagain").addEventListener("click",play);app.querySelector("#hset2").addEventListener("click",setup)};
    draw();
  }
  setup();
}

function route(){
