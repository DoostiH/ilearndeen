<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Short games about Shia Islamic teachings for children from Kindy to Year 9.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<meta name="theme-color" content="#0B6E5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="iLearnDeen">
<title>iLearnDeen</title>
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: phone-first hub, one column of game cards; each game opens full-width with a back bar. */
:root{
  --bg:#F6F3EA; --panel:#FFFFFF; --ink:#1B2A28; --muted:#5D6B68; --line:#DDD6C6; --soft:#EEE8DA;
  --mean:#0B6E5F; --mean-soft:#DDEFE9; --gold:#A86A12; --gold-soft:#F6EAD2; --ok:#1B8A5A; --bad:#C23A2B;
  --t1:#0B6E5F; --t2:#A86A12; --t3:#7A4FB5; --t4:#C2410C; --on-accent:#FFFFFF;
  --display:"Bricolage Grotesque","Vazirmatn","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans","Vazirmatn",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1817; --panel:#172321; --ink:#E8EFEC; --muted:#9AAAA6; --line:#2A3936; --soft:#1D2B28;
  --mean:#4FC3A9; --mean-soft:#173A33; --gold:#E8B04A; --gold-soft:#3A2E17; --ok:#4CC98D; --bad:#FF7A6B;
  --t1:#4FC3A9; --t2:#E8B04A; --t3:#B394F0; --t4:#F08A55; --on-accent:#0F1817; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1817; --panel:#172321; --ink:#E8EFEC; --muted:#9AAAA6; --line:#2A3936; --soft:#1D2B28;
  --mean:#4FC3A9; --mean-soft:#173A33; --gold:#E8B04A; --gold-soft:#3A2E17; --ok:#4CC98D; --bad:#FF7A6B;
  --t1:#4FC3A9; --t2:#E8B04A; --t3:#B394F0; --t4:#F08A55; --on-accent:#0F1817; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:2.3rem;font-weight:800;letter-spacing:-.02em;line-height:1.05}
h2{font-size:1.2rem;font-weight:600}
h3{font-size:1.02rem;font-weight:600}
p{margin:0}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:46px;height:46px;flex:none}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lead{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.accent{background:var(--mean-soft);border-color:transparent}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.chip{font:inherit;font-size:.88rem;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 13px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip[aria-pressed="true"]{border-color:var(--mean);background:var(--mean);color:var(--on-accent)}
.tag{font-family:var(--mono);font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.star{background:var(--gold-soft);color:var(--gold)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--mean);outline-offset:2px}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 20px;cursor:pointer;background:var(--mean);color:var(--on-accent);font-size:1rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);font-weight:500;font-size:.92rem;padding:10px 14px}
.btn.gold{background:var(--gold);color:var(--on-accent)}
input[type=search],select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--mono);font-weight:500;font-size:1.05rem;font-variant-numeric:tabular-nums}
.stat span{font-size:.75rem;color:var(--muted)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gcard{text-align:start;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.gcard:hover{border-color:var(--mean)}
.gcard .gpic{font-size:2rem;line-height:1}
.gcard p{font-size:.88rem;color:var(--muted)}
.gcard .best{font-family:var(--mono);font-size:.75rem;color:var(--ok)}
.gcard.occ{background:var(--gold-soft);border-color:transparent}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:flex;gap:10px;align-items:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.back{font:inherit;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:8px 12px;cursor:pointer}
.stem{font-size:1.05rem}
.bigpic{font-size:4.2rem;line-height:1.1;text-align:center}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{font:inherit;text-align:start;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:1rem}
.choice:hover:not([disabled]){border-color:var(--mean)}
.choice.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--panel))}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--panel))}
.choice.done{opacity:.4}
.choice[disabled]{cursor:default}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tiles .choice{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:16px 10px;min-height:110px;font-size:1.05rem;font-weight:600}
.tiles .choice .pic{font-size:2.6rem;line-height:1}
.tiles.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.seq{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.seq li{display:flex;gap:10px;align-items:center;background:var(--mean-soft);border-radius:10px;padding:8px 12px}
.seq li b{font-family:var(--mono);color:var(--mean)}
.feedback{border-inline-start:4px solid var(--ok);padding:10px 12px;background:var(--bg);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.feedback.no{border-inline-start-color:var(--bad)}
.ref{font-size:.82rem;color:var(--muted)}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:24px;height:7px;border-radius:4px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--mean)}
.stars{font-size:2rem;letter-spacing:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:20;max-width:calc(100% - 32px)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}}
/* class host mode: readable from the back of a room */
.host .hostq{font-family:var(--display);font-size:1.6rem;font-weight:600;line-height:1.25}
.host .choice{font-size:1.2rem;padding:14px 16px}
.host .choice .let{font-family:var(--mono);font-weight:600;color:var(--mean);margin-inline-end:10px}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.score{border-radius:12px;padding:8px 12px;background:var(--soft);display:flex;justify-content:space-between;align-items:center;gap:8px;border-inline-start:6px solid var(--line)}
.score b{font-family:var(--mono);font-size:1.3rem}
@media (min-width:900px){.wrap.wide{max-width:1000px}.host .hostq{font-size:2.2rem}.host .choice{font-size:1.5rem}.host .bigpic{font-size:6rem}}
@media (max-width:440px){h1{font-size:1.95rem}.games{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.host .hostq{font-size:1.35rem}}
/* right-to-left (Farsi) */
[dir="rtl"] body{font-family:"Vazirmatn",var(--body)}
[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] h3{font-family:"Vazirmatn",var(--display)}
[dir="rtl"] .eyebrow,[dir="rtl"] .tag{letter-spacing:0;text-transform:none;font-family:"Vazirmatn",var(--body)}
[dir="rtl"] ul,[dir="rtl"] ol{padding-left:0!important;padding-right:20px!important}
.num,.stat b{direction:ltr}
[dir="rtl"] .choice{unicode-bidi:plaintext}
/* class sessions */
a.btn{text-decoration:none;display:inline-block}
.status{font-size:.85rem;color:var(--muted);display:flex;gap:8px;align-items:center}
.status .led{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.status.live .led{background:var(--ok)}
.status.live{color:var(--ink)}
.bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.btn.warn{background:var(--gold);color:#1B2A28;border-color:var(--gold)}
input.codein,.fld input{font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
.ccode{font-family:var(--mono);font-size:1.1rem;letter-spacing:.12em;border:1.5px solid var(--line);border-radius:8px;padding:2px 10px;direction:ltr}
.codein{font-family:var(--mono)!important;text-transform:uppercase;letter-spacing:.2em;max-width:9em;direction:ltr;text-align:center}
.fld{display:flex;flex-direction:column;gap:6px;font-weight:500}
.bigcode{font-family:var(--mono);font-size:clamp(2.6rem,12vw,4rem);line-height:1;letter-spacing:.12em;font-weight:600;direction:ltr}
.tboard{display:flex;flex-direction:column;gap:14px}
.trow{display:flex;flex-direction:column;gap:6px}
.tname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.tname .dot{width:10px;height:10px;border-radius:50%}
.rank{font-size:.8rem;color:var(--muted);min-width:1.2em}
.tavg{font-family:var(--mono);font-size:1.4rem;font-weight:500}
.tmeta{font-size:.8rem}
.trow .bar{height:12px}
body.proj .wrap,body.proj .wrap.wide{max-width:1100px}
body.proj .bigcode{font-size:clamp(4rem,16vw,10rem)}
body.proj .tname{font-size:1.7rem}
body.proj .tname .dot{width:18px;height:18px}
body.proj .tavg{font-size:3rem}
body.proj .trow .bar{height:22px;border-radius:11px}
body.proj .trow .bar i{border-radius:11px}
body.proj .tmeta{font-size:1.05rem}
body.proj .hostonly,body.proj .topbar{display:none}

/* v0.4.0 games */
.tag.new{background:var(--gold-soft);color:var(--gold)}
.memgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:560px){.memgrid{grid-template-columns:repeat(4,1fr)}}
.memcard{min-height:84px;border-radius:12px;border:1.5px solid var(--line);background:var(--mean);color:var(--panel);font:inherit;font-size:.92rem;padding:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center}
.memcard .face{display:none}.memcard .back{font-size:1.6rem;font-weight:700;opacity:.85}
.memcard.up,.memcard.matched{background:var(--panel);color:var(--ink)}
.memcard.up .face,.memcard.matched .face{display:block}.memcard.up .back,.memcard.matched .back{display:none}
.memcard.matched{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--panel))}
.pairlist,.speedlog{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.speedlog li.ok b{color:var(--ok)}.speedlog li.no b{color:var(--bad)}
.speedq{font-size:1.15rem;min-height:4.5em}
.speedbtns .btn{flex:1;font-size:1.1rem;padding:14px}

.rolebar{display:flex;align-items:center;gap:8px;font-size:.82rem}
.rolebar a{color:var(--mean);font-weight:600}
.rolepick{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.rolebtn{font:inherit;color:var(--ink);background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:24px 18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.rolebtn:hover,.rolebtn[aria-pressed="true"]{border-color:var(--mean)}
.rolebtn .rpic{display:block;width:100%;max-width:240px;background:color-mix(in srgb,var(--mean) 10%,transparent);border-radius:16px;padding:10px 10px 0;line-height:0;overflow:hidden}.rolebtn .rsvg{width:100%;height:auto;display:block}
.rolebtn b{font-family:var(--display);font-size:1.3rem}
.rolebtn span:last-child{color:var(--muted);font-size:.92rem}
a.gcard{text-decoration:none}
.fldg{display:flex;flex-direction:column;gap:8px}.fldg h3{margin:0;font-size:1rem}
.fld select{font:inherit;font-size:1rem;padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);max-width:100%}
.tips{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}
.sboard{display:flex;flex-wrap:wrap;gap:8px}
.sboard.col{flex-direction:column}.sboard.col .steam{flex:none}
.steam{display:flex;align-items:center;gap:8px;border:2px solid var(--line);border-radius:12px;padding:6px 12px;background:var(--bg);flex:1 1 140px}
.steam.on{border-color:var(--tc);box-shadow:0 0 0 2px color-mix(in srgb,var(--tc) 30%,transparent)}
.steam .sname{font-weight:600;flex:1}.steam b{font-size:1.3rem}
.sturn{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border-inline-start:6px solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,var(--panel));border-radius:10px;padding:6px 14px;font-size:1.1rem}
.swin{display:flex;flex-wrap:wrap;gap:8px}.swin .sturn{font-size:1.5rem}
.stimer{position:relative;height:26px;border-radius:13px;background:var(--line);overflow:hidden}
.stimer i{position:absolute;inset:0 auto 0 0;width:100%;background:var(--mean);transition:width 1s linear}
.stimer span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink)}
.sstem{font-size:1.35rem;font-weight:600}
.schoices{counter-reset:opt}
.schoices .choice::before{counter-increment:opt;content:counter(opt,upper-alpha);font-family:var(--mono);font-size:.8rem;opacity:.6;border:1px solid var(--line);border-radius:6px;padding:0 6px;align-self:center}
.choices.schoices .choice::before{margin-inline-end:10px}
.choices.schoices .choice{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;min-height:0;text-align:start;font-size:1.15rem}
.steamchip{font-size:1rem;padding:8px 14px;display:inline-flex;align-items:center;gap:6px}
.sdua{font-size:1.6rem;text-align:center;margin:6px 0 0}
.send{align-items:stretch}.send h2{text-align:center}.send .swin{justify-content:center}
.proj .scr .sstem{font-size:2.2rem}.proj .scr .choice{font-size:1.6rem}.proj .scr .bigpic{font-size:7rem}
.proj .scr .steam{font-size:1.3rem}.proj .scr .steam b{font-size:2rem}.proj .scr .feedback{font-size:1.3rem}.proj .scr .sturn{font-size:1.5rem}
.chosen{border:2px solid var(--mean)}
.chosenrow{display:flex;align-items:center;gap:12px}.chosenrow .gpic{font-size:2.6rem;line-height:1}
.chosentitle{font-family:var(--display);font-size:1.4rem}
.chosen #chosenplay{align-self:flex-start;font-size:1.1rem;padding:12px 26px}
.chosenline{display:flex;flex-direction:column;gap:2px;border-inline-start:4px solid var(--mean);padding-inline-start:10px}
.chosenline b{font-size:1.15rem}
.proj .chosenline b{font-size:1.8rem}
.howin{border-top:1px solid var(--line);padding-top:10px}
.howin summary,.howto summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem}
.howin ol,.howto ol{margin:8px 0 0;padding-inline-start:22px;display:flex;flex-direction:column;gap:6px}
.gcard .when{font-size:.82rem;color:var(--mean);font-weight:600}
.status.warn{font-size:.95rem;color:var(--ink);background:color-mix(in srgb,var(--gold) 16%,var(--panel));border:1.5px solid var(--gold);border-radius:14px;padding:12px 14px;align-items:stretch}
/* v0.7.0 compact home, age question, end screen */
.hero{gap:10px}
.btn.big{font-size:1.15rem;padding:14px 26px;border-radius:14px}
.joinline{margin:0 4px;color:var(--muted);font-size:.92rem}
.linkbtn{font:inherit;background:none;border:0;padding:0;color:var(--mean);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.glist{display:flex;flex-direction:column;gap:10px}
.gcard.wide{flex-direction:row;align-items:center;gap:14px;padding:12px 14px}
.gcard.wide .gpic{font-size:2.1rem;flex:none}
.occtext{display:flex;flex-direction:column;gap:4px;min-width:0}
.occtext h3{margin:0;font-size:1.02rem}
.occtext p{margin:0}
.when-d{font-size:.88rem;color:var(--ink)}
.when-d b{color:var(--gold)}
.morelink{color:var(--mean);font-weight:600;font-size:.9rem;text-decoration:none}
.tabs{gap:6px}
.tabs .chip{font-size:.82rem;padding:6px 11px}
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.gtiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gtile{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:start;min-width:0}
.gtile:hover{border-color:var(--mean)}
.gtile .gpic{font-size:1.7rem;line-height:1}
.gtile b{font-size:.92rem;line-height:1.3;font-weight:600;overflow-wrap:anywhere}
.gtile .best{font-family:var(--mono);font-size:.72rem;color:var(--ok)}
.endnav{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.btn.nextg{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;width:100%}
.btn.nextg .nlab{font-size:.78rem;font-weight:500;opacity:.9;text-transform:uppercase;letter-spacing:.05em}
.btn.nextg b{font-size:1.05rem}
.agepick{display:flex;flex-direction:column;gap:12px}
.agebtn{display:grid;grid-template-columns:auto 1fr;column-gap:14px;row-gap:2px;text-align:start;align-items:center;padding:16px 18px}
.agebtn .agepic{font-size:2.4rem;line-height:1;grid-row:span 2}
.agebtn b{font-size:1.15rem}
.card.howto:not([open]){padding:12px 16px;gap:0}
.card.howto:not([open]) summary{font-size:.98rem}
</style>
</head>

(function(){
const A = window.APP || (window.APP = {});
const LANGS = [{id:"en",name:"English"},{id:"fa",name:"فارسی",rtl:true},{id:"ar",name:"العربية",rtl:true}];
A.LANGS = LANGS.filter(l=>l.id==="en"||(window.SS_DICT&&window.SS_DICT[l.id]&&Object.keys(window.SS_DICT[l.id]).length));
let lang = "";
try{ lang = JSON.parse(localStorage.getItem("ild.lang")) || ""; }catch(e){ lang = ""; }
if(!A.LANGS.some(l=>l.id===lang)){
  const nav = ((navigator.languages&&navigator.languages[0])||navigator.language||"en").toLowerCase();
  lang = nav.startsWith("fa")?"fa":nav.startsWith("ar")?"ar":"en";
  if(!A.LANGS.some(l=>l.id===lang)) lang="en";
}
A.lang = lang;
A.setLang = id => { try{localStorage.setItem("ild.lang",JSON.stringify(id))}catch(e){} location.reload(); };
const L = LANGS.find(l=>l.id===lang);
document.documentElement.lang = lang;
document.documentElement.dir = L.rtl?"rtl":"ltr";

const NUM = /[-−]?\d+(?:[.,]\d+)*%?/g;
const dict = (window.SS_DICT && window.SS_DICT[lang]) || {};
const capture = window.SS_CAPTURE || null;
const INLINE = new Set(["STRONG","EM","B","I","SPAN","SUB","SUP","CODE","BR"]);
const SKIP = new Set(["SCRIPT","STYLE","TEXTAREA"]);
const hasLetters = s => /[A-Za-z]/.test(s);

function lookup(key){ if(capture) capture.add(key); if(lang==="en") return null; const d=dict[key]; return d==null?null:d; }
function fill(tpl,nums){ return tpl.replace(/\{(\d+)\}/g,(_,i)=>nums[+i]!=null?nums[+i]:""); }

/* plain text */
function translate(s){
  const t = s.replace(/\s+/g," ").trim();
  if(!t) return null;
  const nums = [];
  const key = t.replace(NUM, m => { nums.push(m); return "{"+(nums.length-1)+"}"; });
  if(!hasLetters(key)) return null;
  const d = lookup(key);
  if(d==null) return null;
  return s.match(/^\s*/)[0] + fill(d,nums) + s.match(/\s*$/)[0];
}
A.tr = s => translate(String(s)) ?? String(s);

/* mixed sentence */
const isNo = el => el.getAttribute && el.getAttribute("translate")==="no";
function unitOK(el){
  if(INLINE.has(el.nodeName) || SKIP.has(el.nodeName) || isNo(el)) return false;
  let text=false, elem=false;
  for(const c of el.childNodes){
    if(c.nodeType===3){ if(c.data.trim()) text=true; }
    else if(c.nodeType===1){
      if(!INLINE.has(c.nodeName)) return false;
      if(!isNo(c) && c.nodeName!=="BR") for(const g of c.childNodes) if(g.nodeType!==3) return false;
      elem=true;
    } else if(c.nodeType!==8) return false;
  }
  return text && elem;
}
const units = new WeakMap();
function doUnit(el){
  if(units.get(el)===el.innerHTML) return true;
  const nums=[], parts=[], inl=[], keep=[];
  const norm = s => s.replace(NUM, m => { nums.push(m); return "{"+(nums.length-1)+"}"; });
  for(const c of el.childNodes){
    if(c.nodeType===3) parts.push(norm(c.data));
    else if(c.nodeType===1){
      if(c.nodeName==="BR"){ parts.push("<br>"); }
      else if(isNo(c)){ keep.push(c); parts.push("[["+(keep.length-1)+"]]"); }
      else { inl.push(c); parts.push("<"+(inl.length-1)+">"+norm(c.textContent)+"</"+(inl.length-1)+">"); }
    }
  }
  const key = parts.join("").replace(/\s+/g," ").trim();
  if(!hasLetters(key.replace(/<\/?\d+>|\[\[\d+\]\]|<br>/g,""))){ units.set(el,el.innerHTML); return true; }
  const d = lookup(key);
  if(d==null){ units.set(el,el.innerHTML); return !!capture; }
  const frag = document.createDocumentFragment();
  const re = /<(\d+)>([\s\S]*?)<\/\1>|\[\[(\d+)\]\]|<br>/g; let last=0, m;
  const txt = s => { if(s) frag.appendChild(document.createTextNode(fill(s,nums))); };
  while((m=re.exec(d))){
    txt(d.slice(last,m.index));
    if(m[1]!=null){ const o=inl[+m[1]]; if(o){ const n=o.cloneNode(false); n.textContent=fill(m[2],nums); frag.appendChild(n); } }
    else if(m[3]!=null){ const o=keep[+m[3]]; if(o) frag.appendChild(o.cloneNode(true)); }
    else frag.appendChild(document.createElement("br"));
    last = re.lastIndex;
  }
  txt(d.slice(last));
  el.textContent=""; el.appendChild(frag);
  units.set(el,el.innerHTML);
  return true;
}

const seen = new WeakMap();
function doText(n){
  if(seen.get(n)===n.data) return;
  const p = n.parentNode;
  if(p && (SKIP.has(p.nodeName) || (p.closest && p.closest("[translate=no]")))) return;
  if(p && p.nodeType===1 && unitOK(p)){ if(doUnit(p)) return; }
  if(p && p.parentNode && p.parentNode.nodeType===1 && INLINE.has(p.nodeName) && unitOK(p.parentNode)){ if(doUnit(p.parentNode)) return; }
  const r = translate(n.data);
  if(r!=null){ seen.set(n,r); n.data = r; } else seen.set(n,n.data);
}
function doAttrs(el){
  for(const a of ["placeholder","aria-label","title","label"]){
    if(el.hasAttribute && el.hasAttribute(a)){ const v=el.getAttribute(a), r=translate(v); if(r!=null && r!==v) el.setAttribute(a,r); }
  }
}
function walk(node){
  if(!node) return;
  if(node.nodeType===3){ doText(node); return; }
  if(node.nodeType===11){ for(const c of [...node.childNodes]) walk(c); return; }
  if(node.nodeType!==1 || SKIP.has(node.nodeName) || isNo(node)) return;
  doAttrs(node);
  if(unitOK(node) && doUnit(node)) return;
  for(const c of [...node.childNodes]) walk(c);
}
A.translateTree = walk;
function start(){
  walk(document.body);
  new MutationObserver(ms=>{ for(const m of ms){ if(m.type==="characterData") doText(m.target); else m.addedNodes.forEach(walk); } })
    .observe(document.body,{subtree:true,childList:true,characterData:true});
}
if(document.body) start(); else document.addEventListener("DOMContentLoaded",start);
})();

/* ================= iLearnDeen core ================= */
(function(){
const A = window.APP = Object.assign(window.APP||{}, {games:[], sets:[], occasions:[]});
A.reg = g => A.games.push(g);

/* ---------- units, age bands, teams ---------- */
A.UNITS = {
  u1:{name:"Knowing Allah and our beliefs"},
  u2:{name:"Worship in practice"},
  u3:{name:"The 14 Maʿṣūmīn"},
  u4:{name:"Stories of the Prophets"},
  u5:{name:"The Qur'an, duʿā and the Islamic year"},
  u6:{name:"Good character"}
};
A.BANDS = [{id:"k2",name:"Little",yrs:"K–2"},{id:"35",name:"Middle",yrs:"Years 3–5"},{id:"69",name:"Older",yrs:"Years 6–9"}];
A.bandName = id => {const b=A.BANDS.find(x=>x.id===id);return b?`${b.name} (${b.yrs})`:"All ages"};
A.TEAMS = [{id:"noor",name:"Team Noor",c:"var(--t1)"},{id:"sabr",name:"Team Ṣabr",c:"var(--t2)"},{id:"sidq",name:"Team Ṣidq",c:"var(--t3)"},{id:"shukr",name:"Team Shukr",c:"var(--t4)"}];

/* ---------- random helpers ---------- */
const S = A.S = {};
S.r = Math.random;
S.int = (a,b) => a + Math.floor(S.r()*(b-a+1));
S.pick = arr => arr[Math.floor(S.r()*arr.length)];
S.shuffle = arr => {const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(S.r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- utils ---------- */
A.esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
A.h = (tag,attrs={},html="") => {const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k])}e.innerHTML=html;return e};
const store = A.store = {get(k,d){try{const v=localStorage.getItem("ild."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem("ild."+k,JSON.stringify(v))}catch(e){}}};
let toastT; A.toast = msg => {const t=document.getElementById("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)};
A.best = store.get("best",{});
A.me = {team:store.get("team",null)};
A.band = store.get("band","all");
A.inBand = bands => A.band==="all"||!bands||bands.includes(A.band);

/* ---------- usage counts (GoatCounter, optional) ---------- */
const trackQ=[];let trackT=null,trackTries=0;
const trackOn=()=>!!(window.SS_CONFIG&&window.SS_CONFIG.analyticsCode);
const trackFlush=()=>{if(window.goatcounter&&window.goatcounter.count){while(trackQ.length){try{window.goatcounter.count(trackQ.shift())}catch(e){}}clearInterval(trackT);trackT=null}else if(++trackTries>40){trackQ.length=0;clearInterval(trackT);trackT=null}};
A.track = (path,title) => {if(!trackOn()&&!(window.goatcounter&&window.goatcounter.count))return;trackQ.push({path,title:title||path,event:true});if(trackQ.length>50)trackQ.shift();trackFlush();if(trackQ.length&&!trackT){trackTries=0;trackT=setInterval(trackFlush,500)}};
A.award = (gameId,points,max) => {
  A.track("finish/"+gameId);
  const prev=A.best[gameId];
  if(!prev||points>prev.points){A.best[gameId]={points,max};store.set("best",A.best)}
  if(CL.on()&&CL.joined){
    if(A.me.team&&CL.teams().some(t=>t.id===A.me.team)){CL.submit(gameId,points,max)}
    else A.toast(`You scored ${points}/${max}. Pick your team on the home screen so your scores go to your class.`);
  }
};
A.fbUrl = () => ((window.SS_CONFIG||{}).feedbackUrl||"");

/* ---------- class sessions (class server, see class-setup.sql) ---------- */
const CL = A.cls = {joined:store.get("class",null),host:store.get("host",null),q:store.get("classq",[])};
CL.on = () => {const c=window.SS_CONFIG;return !!(c&&c.classUrl&&c.classKey&&typeof fetch==="function")};
CL.rpc = async (fn,args) => {const c=window.SS_CONFIG,key=c.classKey,h={"Content-Type":"application/json",apikey:key};if(!/^sb_/.test(key))h.Authorization="Bearer "+key;
  const ctl=typeof AbortController!=="undefined"?new AbortController():null;const t=setTimeout(()=>{if(ctl)ctl.abort()},12000);
  try{const r=await fetch(c.classUrl.replace(/\/+$/,"")+"/rest/v1/rpc/"+fn,{method:"POST",headers:h,body:JSON.stringify(args||{}),signal:ctl?ctl.signal:undefined});if(!r.ok)throw new Error("http "+r.status);return await r.json()}finally{clearTimeout(t)}};
CL.dev = () => {let d=store.get("dev",null);if(!d||!/^[A-Za-z0-9_-]{8,40}$/.test(d)){const a="abcdefghijkmnpqrstuvwxyz23456789",r=new Uint8Array(16);try{crypto.getRandomValues(r)}catch(e){for(let i=0;i<16;i++)r[i]=Math.floor(Math.random()*256)}d="";r.forEach(x=>d+=a[x%a.length]);store.set("dev",d)}return d};
CL.live = s => !!(s&&s.code&&new Date(s.expires).getTime()>Date.now());
if(CL.joined&&!CL.live(CL.joined)){CL.joined=null;store.set("class",null)}
if(CL.host&&!CL.live(CL.host)){CL.host=null;store.set("host",null)}
CL.teams = () => CL.joined?A.TEAMS.slice(0,CL.joined.teams||4):A.TEAMS;
CL.leave = () => {CL.joined=null;store.set("class",null);CL.q=[];store.set("classq",[])};
CL.norm = c => String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
CL.time = d => {try{return new Date(d).toLocaleTimeString((A.lang||"en"),{hour:"2-digit",minute:"2-digit"})}catch(e){return ""}};
CL.send = it => CL.rpc("submit_score",{p_code:CL.joined.code,p_device:CL.dev(),p_team:it.team,p_game:it.game,p_score:it.score,p_max:it.max});
CL.ended = () => {CL.leave();A.toast("Your class session has ended. Your scores are saved on this device.");if(view==="home")renderHome()};
CL.counts = id => !CL.joined||!CL.joined.chosen||id===CL.joined.chosen||(CL.joined.allowed||[]).includes(id);
CL.noteRule = r => {if(CL.joined&&r){if("chosen" in r)CL.joined.chosen=r.chosen||null;if(r.allowed)CL.joined.allowed=r.allowed;store.set("class",CL.joined)}};
CL.go = id => {if(!id)return;if(id.indexOf("occ-")===0){A.autoOcc=true;location.hash="occasion-"+id.slice(4)}else location.hash=id};
CL.watch = onChange => {if(!CL.on()||!CL.joined)return null;let busy=false;
  const tick=async()=>{if(busy||document.hidden||!CL.joined)return;busy=true;
    try{const r=await CL.rpc("session_status",{p_code:CL.joined.code});
      if(r&&r.ok===false){busy=false;CL.ended();return}
      if(r&&r.ok&&CL.joined){const c=r.chosen||null;CL.joined.allowed=r.allowed||[];if(c!==(CL.joined.chosen||null)){CL.joined.chosen=c;store.set("class",CL.joined);onChange&&onChange(c)}else store.set("class",CL.joined)}}catch(e){}
    busy=false};
  const t=setInterval(tick,5000);tick();return ()=>clearInterval(t)};
CL.flush = async () => {if(!CL.on()||!CL.joined||!CL.q.length||CL.busy)return;CL.busy=true;
  try{while(CL.q.length&&CL.joined){const r=await CL.send(CL.q[0]);CL.q.shift();store.set("classq",CL.q);if(r&&r.reason==="ended"){CL.ended();break}}}catch(e){}CL.busy=false};
CL.submit = async (game,score,max) => {
  max=Math.max(1,Math.min(1000,Math.round(max)||1));const it={game,score:Math.max(0,Math.min(Math.round(score)||0,max)),max,team:A.me.team};
  try{const r=await CL.send(it);
    if(r&&r.ok){A.toast(`Sent to your class team: ${it.score}/${it.max}`);CL.flush();return}
    if(r&&r.reason==="ended"){CL.ended();return}
    if(r&&r.reason==="not_chosen"){CL.noteRule(r);A.toast("This game doesn't count for your class right now. Only the game your teacher chose counts. Your score is saved on this device.");return}
    A.toast("The class didn't accept this score. It is saved on this device.");
  }catch(e){CL.q.push(it);if(CL.q.length>50)CL.q.shift();store.set("classq",CL.q);A.toast("No connection. Your score will go to the class when you're back online.")}
};
window.addEventListener("online",()=>CL.flush());

/* ---------- hints ---------- */
A.curHints=[];
A.hintUI=(box,penalty,onUse,given)=>{const hs=given||A.curHints||[];if(!hs.length)return;let k=0;
  const wrap=A.h("div",{class:"hintwrap",style:"display:flex;flex-direction:column;gap:8px"},`<button class="btn ghost hintbtn" type="button" style="align-self:flex-start">Show a hint${penalty?" (half points for this question)":""}</button><div class="hints"></div>`);
  box.appendChild(wrap);const btn=wrap.querySelector(".hintbtn"),list=wrap.querySelector(".hints");
  btn.addEventListener("click",()=>{if(k>=hs.length)return;if(k===0&&onUse)onUse();list.insertAdjacentHTML("beforeend",`<p class="hint" style="background:var(--mean-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:.92rem"><strong>Hint ${k+1}:</strong> <span>${A.esc(hs[k])}</span></p>`);k++;btn.textContent=k<hs.length?"Another hint":"No more hints";if(k>=hs.length)btn.disabled=true})};

/* a shuffled deck that deals n items per round and reshuffles when it runs out */
A.deck = arr => {let d=S.shuffle(arr),p=0;return {take:n=>{const out=[];for(let k=0;k<n;k++){if(p>=d.length){d=S.shuffle(arr);p=0}out.push(d[p++])}return out}}};
A.mc = (choices,answer) => {const idx=S.shuffle(choices.map((_,k)=>k));return {choices:idx.map(k=>choices[k]),answer:idx.indexOf(answer)}};
const choiceHTML = c => typeof c==="object"?`<span class="pic" aria-hidden="true">${c.pic}</span><span>${c.label}</span>`:c;
const starsHTML = (score,max) => {const n=Math.max(1,Math.round(score/max*5));return `<div class="stars" aria-label="${n} of 5 stars">${"⭐".repeat(n)}${"☆".repeat(5-n)}</div>`};
/* end of a game: Next game (same age, same topic if possible), Play again, All games */
A.nextGame = id => {const cur=A.games.find(g=>g.id===id),u=cur&&cur.units[0][0];
  const pool=A.games.filter(g=>g.id!==id&&A.inBand(g.bands)),fresh=pool.filter(g=>!A.best[g.id]),same=l=>l.filter(g=>g.units.some(x=>x[0]===u));
  for(const l of [same(fresh),fresh,same(pool),pool])if(l.length)return S.pick(l);return null};
const endBtns = id => {const n=A.nextGame(id);
  return `<div class="endnav">${n?`<button class="btn nextg" id="nextg" data-next="${n.id}"><span class="nlab">Next game</span><b>${n.pic?`<span aria-hidden="true">${n.pic}</span> `:""}${A.esc(n.title)}</b></button>`:""}<div class="row"><button class="btn ghost" id="again">Play again</button><button class="btn ghost" id="allg">All games</button></div></div>`};
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("#nextg,#allg");if(!t)return;
  if(t.id==="nextg"){A.track("next-game");location.hash=t.dataset.next}
  else{A.goAll=true;if(location.hash==="#home")A.render();else location.hash="home"}});
const endMsg = (score,max) => score>=max*0.8?"Excellent work, mā shāʾ Allāh!":score>=max*0.5?"Good effort! Play again to remember even more.":"Nice try! Read the answers again, then play another round.";

/* ---------- question banks ----------
   Item: {b:["k2","35","69"], pic?, q, c:[correct, wrong, wrong], e (explanation), ref?}
   Choices may be strings or {pic,label} tiles. The first choice is the correct one; it is shuffled on display
   unless the item has keep:true. */
A.pickBand = (bank,band) => {const b=band||A.band;let l=b==="all"?bank:bank.filter(q=>q.b.includes(b));return l.length?l:bank};
A.asQ = it => {const m=it.keep?{choices:it.c,answer:it.a||0}:A.mc(it.c,it.a||0);return {pic:it.pic,hint:it.h,html:`<p>${it.q}</p>`,choices:m.choices,answer:m.answer,explain:`<p>${it.e}</p>`+(it.ref?`<p class="ref">${it.ref}</p>`:"")}};
/* a question set that games, occasions and class host mode can all draw from */
A.addSet = set => {const decks={};set.take=set.take||((band,n)=>{const k=band||"all";if(!decks[k])decks[k]=A.deck(A.pickBand(set.bank,k));return decks[k].take(n)});A.sets.push(set);return set};
A.bankQuiz = (el,cfg) => {const set=cfg.set;let order=[];A.quiz(el,{id:cfg.id,n:cfg.n||5,intro:cfg.intro,onStart(){order=set.take(A.band,cfg.n||5)},gen:i=>A.asQ(order[i])})};

/* ---------- quiz engine ----------
   cfg: {id, n, points=10, intro?, onStart?(), gen(i) -> {pic?, role?, html, choices[], answer, explain}}
   multi-step: gen returns {html, steps:[{html, choices, answer, explain}, …]} */
A.quiz = (el,cfg) => {
  const pts=cfg.points||10;let hinted=false,i=0,score=0,res=[],q=null,step=0;
  const box=A.h("div",{class:"card"});el.appendChild(box);
  const start=()=>{if(cfg.onStart)cfg.onStart();i=0;score=0;res=[];next()};
  const next=()=>{q=cfg.gen(i);step=0;q._miss=false;draw()};
  const cur=()=>q.steps?q.steps[step]:q;
  function draw(){
    const s=cur(),tiles=s.choices.some(c=>typeof c==="object");
    box.innerHTML=`<div class="row between"><div class="dots">${Array.from({length:cfg.n},(_,k)=>`<i class="${k<res.length?(res[k]?"ok":"no"):k===i?"cur":""}"></i>`).join("")}</div><span class="num lead">${score} pts</span></div>`+
      (q.role?`<span class="tag">Your role: ${A.esc(q.role)}</span>`:"")+
      (step===0&&q.pic?`<div class="bigpic" aria-hidden="true">${q.pic}</div>`:"")+
      (step===0&&q.html?`<div class="stem">${q.html}</div>`:"")+(s.html&&q.steps?`<div class="stem">${s.html}</div>`:"")+
      `<div class="${tiles?"tiles"+(s.choices.length===3?" three":""):"choices"}">${s.choices.map((c,k)=>`<button class="choice" data-k="${k}">${choiceHTML(c)}</button>`).join("")}</div><div class="fb"></div>`;
    box.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>answer(+b.dataset.k)));
    hinted=false;const hl=s.hint?[s.hint]:(step===0&&q.hint?[q.hint]:[]);A.hintUI(box.querySelector(".fb").parentNode.insertBefore(A.h("div"),box.querySelector(".fb")),true,()=>{hinted=true},hl);
  }
  function answer(k){
    const s=cur(),ok=k===s.answer;
    box.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(j===s.answer)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
    const last=!q.steps||step===q.steps.length-1;
    const hw=box.querySelector(".hintwrap .hintbtn");if(hw)hw.disabled=true;
    if(ok)score+=Math.round((q.steps?pts/q.steps.length:pts)*(hinted?0.5:1));
    if(!ok)q._miss=true;
    const fb=box.querySelector(".fb");
    fb.innerHTML=`<div class="feedback ${ok?"":"no"}"><p><strong>${ok?"Well done!":"Not quite."}</strong></p>${s.explain||""}</div><div class="row" style="margin-top:10px"><button class="btn" id="qn">${last?(i===cfg.n-1?"See results":"Next"):"Continue"}</button></div>`;
    box.querySelector("#qn").addEventListener("click",()=>{
      if(!last){step++;draw();return}
      res.push(!q._miss);i++;
      if(i<cfg.n)next();else finish();
    });
  }
  function finish(){
    const max=cfg.n*pts;A.award(cfg.id,score,max);
    box.innerHTML=`${starsHTML(score,max)}<h2>${score} / ${max} points</h2><p class="lead">${endMsg(score,max)}</p><p class="lead" style="font-size:.85rem">Best scores are saved on this device.</p>${endBtns(cfg.id)}`;
    box.querySelector("#again").addEventListener("click",start);
  }
  if(cfg.intro){box.innerHTML=`<p>${cfg.intro}</p><div class="row"><button class="btn" id="go">Start</button></div>`;box.querySelector("#go").addEventListener("click",start)}else start();
};
/* Tap engine for the youngest players: the same quiz with big picture tiles */
A.tap = (el,cfg) => A.quiz(el,cfg);

/* ---------- rounds engine (hands-on games with custom scoring) ----------
   cfg: {id, n, max, onStart?(), render(body, api)}  api: {round, add(points), next()} */
A.rounds = (el,cfg) => {
  let r=0,score=0,rh=null;const box=A.h("div",{class:"card"});el.appendChild(box);
  const api={get round(){return r},add:p=>{score+=p},get score(){return score},setHints:l=>{rh=l},
    next:()=>{r++;if(r<cfg.n)paint();else{const max=cfg.n*cfg.max,sc=Math.round(score);A.award(cfg.id,sc,max);box.innerHTML=`${starsHTML(sc,max)}<h2>${sc} / ${max} points</h2><p class="lead">${endMsg(sc,max)}</p><p class="lead" style="font-size:.85rem">Best scores are saved on this device.</p>${endBtns(cfg.id)}`;box.querySelector("#again").addEventListener("click",()=>{r=0;score=0;if(cfg.onStart)cfg.onStart();paint()})}}};
  const paint=()=>{box.innerHTML=`<div class="row between"><span class="eyebrow">Round ${r+1} of ${cfg.n}</span><span class="num lead">${Math.round(score)} pts</span></div><div class="body" style="display:flex;flex-direction:column;gap:12px"></div><div class="hb"></div>`;rh=null;cfg.render(box.querySelector(".body"),api);A.hintUI(box.querySelector(".hb"),false,null,rh||A.curHints)};
  if(cfg.onStart)cfg.onStart();paint();
};
/* Ordering helper used by rounds games: tap items in the right order.
   After 3 wrong taps the right order is shown, so young players never get stuck. */
A.orderTask = (body,api,{prompt,items,max=10,explain=""}) => {
  let pos=0,miss=0;const sh=S.shuffle(items.map((_,k)=>k));
  body.innerHTML=`<p class="stem"><strong>${prompt}</strong></p><ol class="seq"></ol><div class="choices">${sh.map(k=>`<button class="choice" data-k="${k}">${items[k]}</button>`).join("")}</div><div class="fb"></div>`;
  const seq=body.querySelector(".seq"),fb=body.querySelector(".fb");
  const add=k=>{seq.insertAdjacentHTML("beforeend",`<li><b>${k+1}</b><span>${items[k]}</span></li>`)};
  const end=shown=>{body.querySelectorAll(".choice").forEach(b=>b.disabled=true);const p=shown?0:Math.max(0,max-2*miss);api.add(p);
    fb.innerHTML=`<div class="feedback ${shown?"no":""}"><p><strong>${shown?"Here is the right order.":miss?"Well done! You got there.":"Perfect order!"}</strong> +${p} points</p>${explain}</div><div class="row" style="margin-top:10px"><button class="btn" id="nx">Next</button></div>`;
    body.querySelector("#nx").addEventListener("click",api.next)};
  body.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{const k=+b.dataset.k;
    if(k===pos){b.disabled=true;b.classList.add("done");add(k);pos++;if(pos===items.length)end(false)}
    else{miss++;b.classList.remove("shake");void b.offsetWidth;b.classList.add("shake");if(miss>=3){for(let j=pos;j<items.length;j++)add(j);end(true)}}}));
};

/* One multiple-choice question inside a rounds game, with its own hint. */
A.askTask = (body,api,q,pts=10) => {
  api.setHints(q.hint?[q.hint]:[]);
  const tiles=q.choices.some(c=>typeof c==="object");
  body.innerHTML=`${q.pic?`<div class="bigpic" aria-hidden="true">${q.pic}</div>`:""}<div class="stem">${q.html}</div><div class="${tiles?"tiles"+(q.choices.length===3?" three":""):"choices"}">${q.choices.map((c,j)=>`<button class="choice" data-j="${j}">${choiceHTML(c)}</button>`).join("")}</div><div class="fb"></div>`;
  body.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{const j=+b.dataset.j,ok=j===q.answer;
    body.querySelectorAll(".choice").forEach((x,k)=>{x.disabled=true;if(k===q.answer)x.classList.add("right");else if(k===j)x.classList.add("wrong")});

    body.querySelector("#nx").addEventListener("click",api.next)}));

A.mixedRounds = (el,cfg) => {let ords=[],qs=[];
  A.rounds(el,{id:cfg.id,n:cfg.n||5,max:10,onStart(){const fit=(cfg.orders||[]).filter(o=>A.band==="all"||o.b.includes(A.band));ords=fit.length?[S.pick(fit)]:[];qs=cfg.set.take(A.band,(cfg.n||5)-ords.length)},
    render(body,api){const r=api.round;if(r<ords.length){A.orderTask(body,api,ords[r]);return}A.askTask(body,api,A.asQ(qs[r-ords.length]))}});

/* Memory pairs: turn over two cards at a time and find the pairs. */
A.memory = (el,cfg) => {
  const box=A.h("div",{class:"card"});el.appendChild(box);
  const start=()=>{
    const pool=cfg.sets.filter(x=>A.band==="all"||x.b.includes(A.band)),set=S.pick(pool.length?pool:cfg.sets);
    const pairs=S.shuffle(set.pairs).slice(0,6),cards=S.shuffle(pairs.flatMap(p=>[p[0],p[1]]));
    const isPair=(a,b)=>pairs.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a));
    let open=[],done=0,tries=0,lock=false;const matched=new Set();
    box.innerHTML=`<div class="row between"><span class="eyebrow">${A.esc(set.title)}</span><span class="num lead"><span>Tries</span> <b id="mtries">0</b></span></div><p class="lead" style="font-size:.9rem">Tap two cards to find a matching pair.</p><div class="memgrid">${cards.map((c,j)=>`<button class="memcard" data-j="${j}"><span class="back" aria-hidden="true">?</span><span class="face">${c}</span></button>`).join("")}</div><div class="fb"></div>`;
    const btns=[...box.querySelectorAll(".memcard")];
    btns.forEach(b=>b.addEventListener("click",()=>{const j=+b.dataset.j;if(lock||matched.has(j)||open.includes(j))return;
      b.classList.add("up");open.push(j);if(open.length<2)return;
      tries++;box.querySelector("#mtries").textContent=tries;const [x,y]=open;
      if(isPair(cards[x],cards[y])){[x,y].forEach(k=>{matched.add(k);btns[k].classList.add("matched");btns[k].disabled=true});open=[];done++;if(done===pairs.length)finish()}
      else{lock=true;setTimeout(()=>{btns[x].classList.remove("up");btns[y].classList.remove("up");open=[];lock=false},1000)}}));
    const finish=()=>{const max=pairs.length*10,score=Math.max(pairs.length*2,max-(tries-pairs.length)*5);A.award(cfg.id,score,max);
      box.querySelector(".fb").innerHTML=`${starsHTML(score,max)}<h2>${score} / ${max} points</h2><p class="lead">${endMsg(score,max)}</p><ul class="pairlist">${pairs.map(p=>`<li><span>${p[0]}</span> ↔ <span>${p[1]}</span></li>`).join("")}</ul><p class="ref">${set.ref}</p>${endBtns(cfg.id)}`;
      box.querySelector("#again").addEventListener("click",start);box.querySelector(".fb").scrollIntoView&&box.querySelector(".fb").scrollIntoView({block:"nearest",behavior:"smooth"})};
  };
  start();
};
/* Speed round: true or false, as many as you can before the timer runs out. */
A.speed = (el,cfg) => {
  const box=A.h("div",{class:"card"});el.appendChild(box);let tick=null;
  const lvl={k2:["k2"],"35":["k2","35"],"69":["k2","35","69"]};
  const intro=()=>{box.innerHTML=`<p class="lead">You have <b>${cfg.seconds}</b> seconds. Tap <strong>True</strong> or <strong>False</strong> as fast as you can.</p><div class="row"><button class="btn" id="go">Start</button></div>`;box.querySelector("#go").addEventListener("click",start)};
  const start=()=>{
    const ok=lvl[A.band]||["k2","35","69"],pool=S.shuffle(cfg.items.filter(x=>x.b.some(b=>ok.includes(b))));
    let i=0,score=0,left=cfg.seconds;const log=[];
    box.innerHTML=`<div class="row between"><span class="num lead"><span>Time left</span> <b id="sleft">${left}</b></span><span class="num lead"><b id="sscore">0</b> <span>pts</span></span></div><div class="stem speedq" id="sq"></div><div class="row speedbtns"><button class="btn tf" data-v="1">✓ <span>True</span></button><button class="btn tf ghost" data-v="0">✗ <span>False</span></button></div><p class="lead" id="sfb" style="min-height:1.4em" aria-live="polite"></p>`;
    const sq=box.querySelector("#sq"),fb=box.querySelector("#sfb");
    const show=()=>{sq.innerHTML=`<p>${pool[i].s}</p>`};
    const end=()=>{clearInterval(tick);tick=null;const max=Math.max(10,pool.length*10);A.award(cfg.id,score*10,max);
      box.innerHTML=`${starsHTML(score*10,max)}<h2>${score*10} / ${max} points</h2><p class="lead">${endMsg(score*10,max)}</p>${log.length?`<ul class="speedlog">${log.map(l=>`<li class="${l.ok?"ok":"no"}"><span>${l.s}</span> <b>${l.t?"True":"False"}</b><br><small>${l.e}</small></li>`).join("")}</ul>`:""}${endBtns(cfg.id)}`;
      box.querySelector("#again").addEventListener("click",start)};
    box.querySelectorAll(".tf").forEach(b=>b.addEventListener("click",()=>{if(!tick)return;const it=pool[i],ans=b.dataset.v==="1",right=ans===it.t;
      if(right)score++;log.push({s:it.s,t:it.t,e:it.e,ok:right});box.querySelector("#sscore").textContent=score*10;
      fb.innerHTML=right?`<strong>✓ Well done!</strong>`:`<strong>✗ Not quite.</strong>`;i++;if(i>=pool.length)end();else show()}));
    show();tick=setInterval(()=>{if(!box.isConnected){clearInterval(tick);return}left--;const el2=box.querySelector("#sleft");if(el2)el2.textContent=left;if(left<=0)end()},1000);
  };
  intro();
};

/* ---------- occasions ---------- */
/* A.addOccasion({id, title, date, pic, blurb, about, bank, mix}) — mix = a general akhlāq bank;
   each draw is about 60% occasion questions and 40% general questions. */
A.addOccasion = o => {const d1={},d2={};
  const take=(band,n)=>{const k=band||"all";if(!d1[k])d1[k]=A.deck(A.pickBand(o.bank,k));if(!d2[k])d2[k]=A.deck(A.pickBand(o.mix,k));const m=o.mix&&o.mix.length?Math.floor(n*0.4):0;return S.shuffle(d1[k].take(n-m).concat(m?d2[k].take(m):[]))};
  A.occasions.push(o);A.addSet({id:o.id,title:o.title+" ("+o.date+")",occ:true,bank:o.bank.concat(o.mix||[]),take});return o};
/* ---------- occasion dates ----------
   IRAN = first day of each Hijri month from Iran's official calendar (Geophysics Institute, University of Tehran),
   as [hijriYear, month, Gregorian date of day 1]. After the table ends, the phone's Umm al-Qurā calendar is used. */
const IRAN=[[1448,6,"2026-11-11"],[1448,7,"2026-12-11"],[1448,8,"2027-01-10"],[1448,9,"2027-02-08"],[1448,10,"2027-03-10"],[1448,11,"2027-04-08"],[1448,12,"2027-05-08"],
  [1449,1,"2027-06-06"],[1449,2,"2027-07-05"],[1449,3,"2027-08-04"],[1449,4,"2027-09-02"],[1449,6,"2027-10-31"],[1449,7,"2027-11-30"],[1449,8,"2027-12-30"],[1449,9,"2028-01-28"],[1449,10,"2028-02-27"]];
/* Hijri month and day(s) for each occasion; len = the whole month */
const OCC_HD={"shaban-15":[8,15],"rajab-13":[7,13],"jumada-20":[6,20],"rabi-17":[3,17],ramadan:[9,1,30],ghadir:[12,18],muharram:[1,1,10],"eid-al-fitr":[10,1],"eid-al-adha":[12,10],mabath:[7,27],mubahalah:[12,24],"shaban-births":[8,3,3],"imam-rida":[11,11],arbain:[2,20]};
const DAY=864e5,utc=s=>Date.parse(s+"T00:00:00Z");
const todayUTC=()=>{const n=new Date();return Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())};
let uqf=null;try{uqf=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{year:"numeric",month:"numeric",day:"numeric",timeZone:"UTC"});if(uqf.resolvedOptions().calendar!=="islamic-umalqura")uqf=null}catch(e){uqf=null}
const uqParts=t=>{const o={};uqf.formatToParts(new Date(t)).forEach(p=>{o[p.type]=p.value});return {y:+o.year,m:+o.month,d:+o.day}};
/* Gregorian (UTC ms) of day 1 of Hijri month m of year y, or null */
function monthStart(y,m){const row=IRAN.find(r=>r[0]===y&&r[1]===m);if(row)return utc(row[2]);
  const last=IRAN[IRAN.length-1],lastT=utc(last[2]),k=(y-last[0])*12+(m-last[1]);
  if(k<=0||!uqf)return null;
  const est=lastT+Math.round(k*29.530588*DAY);
  for(let dd=-4;dd<=4;dd++){const t=est+dd*DAY,p=uqParts(t);if(p.y===y&&p.m===m&&p.d===1)return t}
  return null}
/* the next time this occasion happens (or is happening now): {start, end, now:bool, days} */
A.occWhen = id => {const hd=OCC_HD[id];if(!hd)return null;const [m,d,len=1]=hd,today=todayUTC();
  for(let y=1448;y<=1452;y++){const ms=monthStart(y,m);if(ms==null)continue;const s=ms+(d-1)*DAY,e=s+(len-1)*DAY;
    if(e>=today)return {start:s,end:e,now:s<=today,days:Math.round((s-today)/DAY)}}
  return null};
A.fmtDay = t => {const d=new Date(t),thisYear=new Date().getFullYear()===d.getUTCFullYear(),o={weekday:"short",day:"numeric",month:"short",timeZone:"UTC"};
  try{if(A.lang==="fa"){const f=new Intl.DateTimeFormat("fa-IR-u-ca-persian",Object.assign(o,{weekday:"long",month:"long"},thisYear?{}:{year:"numeric"}));return f.format(d)}
    if(A.lang==="ar"){return new Intl.DateTimeFormat("ar-u-ca-gregory-nu-arab",Object.assign(o,{weekday:"long",month:"long"},thisYear?{}:{year:"numeric"})).format(d)}
    return new Intl.DateTimeFormat("en-GB",Object.assign(o,thisYear?{}:{year:"numeric"})).format(d)}catch(e){return d.toISOString().slice(0,10)}};
/* "Today", "Tomorrow", "In 7 days", "This month" */
const whenWords = (id,w) => {const hd=OCC_HD[id]||[];const month=(hd[2]||1)>=10;
  if(w.now)return month?"This month":"Today";
  return w.days===1?"Tomorrow":`In ${w.days} days`};
A.occsByDate = () => A.occasions.map(o=>({o,w:A.occWhen(o.id)})).sort((a,b)=>(a.w?a.w.start:1e15)-(b.w?b.w.start:1e15));
const dateLine = (o,w) => w?`<span class="when-d"><b>${whenWords(o.id,w)}</b> · <span translate="no">${A.esc(A.fmtDay(w.start))}</span></span>`:"";

}

function screenSets(){
  return {games:A.sets.filter(s=>!s.occ),occs:A.sets.filter(s=>s.occ)};

function mixTake(band,n){
  const pool=A.sets.filter(s=>!s.occ).filter(s=>{const g=A.games.find(x=>x.id===s.id||s.id.indexOf(x.id)===0);return !g||band==="all"||!g.bands||g.bands.includes(band)});
  if(!pool.length)pool.push(...A.sets.filter(s=>!s.occ));
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard++<n*20){const s=S.pick(pool);const q=s.take(band,1)[0];if(!q||seen.has(q.q))continue;seen.add(q.q);out.push(q)}
  return out;
}

function play(c){
  const set=A.sets.find(s=>s.id===c.set);
  const teams=A.TEAMS.slice(0,c.teams);
  const n=c.mode==="turn"?c.per*c.teams:c.total;
  const qs=(set?set.take(c.band,n):mixTake(c.band,n)).map(A.asQ);
  const score=teams.map(()=>0);
  let i=0,timer=null,left=0;
  const stopT=()=>{if(timer){clearInterval(timer);timer=null}};
  cleanup=()=>{stopT();document.body.classList.remove("proj");try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}};
  const board=hi=>`<div class="sboard">${teams.map((t,k)=>`<div class="steam ${hi===k?"on":""}" style="--tc:${t.c}"><span class="dot" style="background:${t.c}"></span><span class="sname">${t.name}</span><b class="num">${score[k]}</b></div>`).join("")}</div>`;
  const fsBtn=()=>`<button class="btn ghost" id="sfs">${document.body.classList.contains("proj")?"Exit full screen":"Full screen"}</button>`;
  const bindFs=()=>{const b=app.querySelector("#sfs");if(b)b.addEventListener("click",()=>{const on=!document.body.classList.contains("proj");document.body.classList.toggle("proj",on);
    try{if(on&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});else if(!on&&document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}b.textContent=on?"Exit full screen":"Full screen"})};
  function ask(){
    stopT();
    if(i>=qs.length)return end();
    const q=qs[i];const turn=c.mode==="turn"?i%teams.length:-1;
    let team=turn,tried=[],done=false;
    const tiles=q.choices.some(x=>typeof x==="object");
    app.innerHTML=`<div class="topbar"><button class="back" id="back">← Home</button><span class="eyebrow">Class on one screen</span></div>
    <section class="card scr">
      <div class="row between"><span class="num lead">Question ${i+1} of ${qs.length}</span>${fsBtn()}</div>
      ${board(turn)}
      ${c.mode==="turn"?`<div class="sturn" style="--tc:${teams[turn].c}"><span>Turn:</span> <b>${teams[turn].name}</b></div>`:""}
      ${c.timer?`<div class="stimer"><i id="sbar"></i><span class="num" id="stleft">${c.timer}</span></div>`:""}
      ${q.pic?`<div class="bigpic" aria-hidden="true">${q.pic}</div>`:""}
      <div class="stem sstem">${q.html}</div>
      <div class="${tiles?"tiles"+(q.choices.length===3?" three":""):"choices"} schoices">${q.choices.map((x,k)=>`<button class="choice" data-k="${k}">${choiceHTML(x)}</button>`).join("")}</div>
      <div id="spick"></div>
      <div class="fb" id="sfb"></div>
      <div class="row" id="sctl">${q.hint?`<button class="btn ghost" id="shint">Show a hint</button>`:""}${c.mode==="hand"?`<button class="btn ghost" id="sshow">Show the answer</button>`:""}</div>
    </section>`;
    app.querySelector("#back").addEventListener("click",()=>{location.hash="home"});bindFs();
    const ch=[...app.querySelectorAll(".schoices .choice")];
    const pick=app.querySelector("#spick"),fb=app.querySelector("#sfb");
    const setEnabled=on=>ch.forEach((b,k)=>{if(!b.classList.contains("wrong"))b.disabled=!on});
    const askTeam=msg=>{const opts=teams.map((t,k)=>k).filter(k=>!tried.includes(k));
      pick.innerHTML=`<p class="lead"><strong>${msg}</strong></p><div class="row">${opts.map(k=>`<button class="chip steamchip" data-t="${k}"><span class="dot" style="background:${teams[k].c}"></span>${teams[k].name}</button>`).join("")}</div>`;
      pick.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>{team=+b.dataset.t;pick.innerHTML=`<div class="sturn" style="--tc:${teams[team].c}"><span>Answering:</span> <b>${teams[team].name}</b></div>`;setEnabled(true)}))};
    const reveal=(ok,msg)=>{done=true;stopT();
      ch.forEach((b,k)=>{b.disabled=true;if(k===q.answer)b.classList.add("right")});
      pick.innerHTML="";
      const hb=app.querySelector("#shint");if(hb)hb.remove();const sb=app.querySelector("#sshow");if(sb)sb.remove();
      app.querySelector(".sboard").outerHTML=board(ok?team:-1);
      fb.innerHTML=`<div class="feedback ${ok?"":"no"}"><p><strong>${msg}</strong></p>${q.explain||""}</div><div class="row" style="margin-top:10px"><button class="btn" id="snext">${i===qs.length-1?"See the winners":"Next question"}</button></div>`;
      app.querySelector("#snext").addEventListener("click",()=>{i++;ask();window.scrollTo(0,0)});
      fb.scrollIntoView&&fb.scrollIntoView({block:"nearest",behavior:"smooth"})};
    ch.forEach((b,k)=>b.addEventListener("click",()=>{if(done||team<0)return;
      if(k===q.answer){score[team]++;reveal(true,"Well done!")}
      else{b.classList.add("wrong");b.disabled=true;
        if(c.mode==="turn")reveal(false,"Not quite.");
        else{tried.push(team);team=-1;setEnabled(false);
          if(tried.length>=teams.length)reveal(false,"Not quite.");else askTeam("Not quite. Another team can try. Which team put a hand up?")}}}));
    if(c.mode==="hand"){setEnabled(false);askTeam("Which team put a hand up first?")}
    const hb=app.querySelector("#shint");if(hb)hb.addEventListener("click",()=>{hb.outerHTML=`<p class="hint" style="background:var(--mean-soft);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:1rem"><strong>Hint 1:</strong> <span>${A.esc(q.hint)}</span></p>`});
    const sb=app.querySelector("#sshow");if(sb)sb.addEventListener("click",()=>reveal(false,"Here is the answer."));
    if(c.timer){left=c.timer;const bar=app.querySelector("#sbar"),tl=app.querySelector("#stleft");
      timer=setInterval(()=>{left--;if(tl)tl.textContent=Math.max(0,left);if(bar)bar.style.width=(left/c.timer*100)+"%";
        if(left<=0){stopT();if(!done){ch.forEach(b=>{if(!b.classList.contains("wrong"))b.disabled=true});reveal(false,"Time's up!")}}},1000)}
  }
  function end(){
    stopT();
    const best=Math.max(...score),win=teams.filter((t,k)=>score[k]===best);
    const order=teams.map((t,k)=>({t,s:score[k]})).sort((a,b)=>b.s-a.s);
    app.innerHTML=`<div class="topbar"><button class="back" id="back">← Home</button><span class="eyebrow">Class on one screen</span></div>
    <section class="card scr send">
      <div class="row between"><span class="eyebrow">Game over</span>${fsBtn()}</div>
      <div class="bigpic" aria-hidden="true">🏆</div>
      <h2>${win.length===1?"The winning team":"It's a tie!"}</h2>
      <div class="swin">${win.map(t=>`<span class="sturn" style="--tc:${t.c}"><b>${t.name}</b></span>`).join("")}</div>
      <div class="sboard col">${order.map(r=>`<div class="steam" style="--tc:${r.t.c}"><span class="dot" style="background:${r.t.c}"></span><span class="sname">${r.t.name}</span><b class="num">${r.s}</b></div>`).join("")}</div>
      <p class="sdua" translate="no" dir="rtl" lang="ar">اللّهُمَّ صَلِّ عَلىٰ مُحَمَّدٍ وَآلِ مُحَمَّدٍ</p>
      <p class="lead">Well done, everyone! May Allah bless what you learned today.</p>
      <div class="row"><button class="btn" id="sagain">Play again</button><button class="btn ghost" id="sset2">Change the settings</button></div>
    </section>`;
    app.querySelector("#back").addEventListener("click",()=>{location.hash="home"});bindFs();
    app.querySelector("#sagain").addEventListener("click",()=>{play(c);window.scrollTo(0,0)});
    app.querySelector("#sset2").addEventListener("click",()=>{cleanup();cleanup=null;renderScreen();window.scrollTo(0,0)});
  }
  ask();window.scrollTo(0,0);
}

function route(){
  resetAsk=false;
  if(cleanup){try{cleanup()}catch(e){}cleanup=null}
  const h=decodeURIComponent(location.hash.replace("#",""));
  const g=A.games.find(x=>x.id===h);
  if(g)renderGame(g);
  else if(h==="class-host")renderHost();
  else if(h==="class-screen")renderScreen();
  else if(h==="role")renderRole();
  else if(h==="age")renderAge();
  else if(h==="occasions")renderOccList();
  else if(h==="board")renderBoard(false);
  else if(h==="host"||h.startsWith("host-")){location.replace("#class-host");return}
  else if(h.startsWith("occasion-")&&A.occasions.some(o=>o.id===h.slice(9)))renderOcc(A.occasions.find(o=>o.id===h.slice(9)));
  else renderHome();
  window.scrollTo(0,0);
}
A.render = () => route();
A.start = () => {A.track("app-lang/"+(A.lang||"en"));window.addEventListener("hashchange",route);route()};
})();

 Q(["69"],"🌍","A baby is born somewhere with no chance to hear about Islam. Is it fair to judge them like someone who knew everything?",["No. Allah judges each person by what they knew and could do", "Yes, everyone is judged the same", "Allah does not judge anyone"],"Allah does not punish anyone for what never reached them. Everyone is judged fairly.","Qur'an 17:15; 2:286","Think of “Allah does not burden a soul beyond its capacity”."),
 Q(["69"],"🧩","Why did Allah give humans free will?",["So we can choose good and truly earn reward", "So we can never make mistakes", "It was an accident"],"A test only means something if we can choose. Free will makes our good choices our own.","Qur'an 76:3","Can a robot earn a reward?"),

 Q(["69"],"🐜","How small a good deed will Allah reward?",["Even the weight of a tiny speck (dharrah)", "Only big deeds", "None, only prayers count"],"Whoever does a speck's weight of good will see it.","Qur'an 99:7–8","Sūrat al-Zalzalah."),
 Q(["69"],"😢","Someone says: “If Allah is fair, why are some people rich and some poor?”",["Wealth is a test; the rich are tested by giving, the poor by patience, and both are judged fairly", "Rich people are always better", "Poor people are always punished"],"Both wealth and poverty are tests, and Allah's reward is not measured by money.","Qur'an 89:15–20; 49:13","Who is the better person in Allah's eyes?"),
 Q(["69"],"🔥","When his brother ʿAqīl asked Imam ʿAlī (ʿa) for extra money from the public treasury, what did the Imam do?",["He refused, and brought a heated piece of iron near him to remind him of the fire of the hereafter", "He gave him double", "He took extra money for himself too"],"Imam ʿAlī (ʿa) would not give anyone, even his own brother, more than their right from public money.","Nahj al-Balāghah, Sermon 224","Public money belongs to everyone."),

/* ================= iLearnDeen occasions =================
   Each pack = questions about the occasion + general good-character questions (mixed in about 40%).
   Muḥarram is introduced gently: values and love, no distressing detail. */
(function(){
const A=APP,Q=A.Q,T=A.T;
const MAHDI_REF="Shaykh al-Ṣadūq, Kamāl al-Dīn; Shaykh al-Mufīd, al-Irshād";

const MAFATIH="Shaykh ʿAbbās al-Qummī, Mafātīḥ al-Jinān";

/* ---------- 15 Shaʿbān: Imam al-Mahdī (ʿaj) ---------- */
A.addOccasion({id:"shaban-15",title:"Imam al-Mahdī (ʿaj)",date:"15 Shaʿbān",pic:"🌕",
 blurb:"The birthday of our living Imam.",
 about:"On 15 Shaʿbān we celebrate the birth of Imam al-Mahdī (ʿaj), the twelfth Imam. He is alive today, hidden from our eyes, and we wait for his return by doing good.",
 mix:A.AKHLAQ,
 bank:[
  Q(["k2"],"🎂","On 15 Shaʿbān we celebrate the birthday of…",[T("🌕","Imam al-Mahdī (ʿaj)"),T("🚢","Prophet Nūḥ (ʿa)")],"15 Shaʿbān is the birthday of Imam al-Mahdī (ʿaj), our twelfth Imam.",MAHDI_REF,"Look at the moon picture: it's the Imam we celebrate in Shaʿbān."),
  Q(["k2"],"🌟","Which Imam is alive today?",[T("🌕","Imam al-Mahdī (ʿaj)"),T("🕌","Imam ʿAlī (ʿa)")],"Imam al-Mahdī (ʿaj) is our living Imam. Allah keeps him hidden until the time he returns.",MAHDI_REF,"He is the Imam we are waiting for."),
  Q(["k2"],"🤲","What can we do for Imam al-Mahdī (ʿaj)?",[T("🤲","Pray for him and be good"),T("😴","Forget about him")],"We pray for the Imam and try to be good, so he is happy with us.",MAFATIH,"Which choice would make the Imam happy?"),
  Q(["k2"],"⚖️","When Imam al-Mahdī (ʿaj) returns, he will fill the world with…",[T("⚖️","Justice and fairness"),T("🔊","Noise")],"The Prophet (ṣ) told us the Mahdī will fill the earth with justice after it has been filled with injustice.",MAHDI_REF,"Look at the scales in the picture."),
  Q(["k2"],"🔢","Imam al-Mahdī (ʿaj) is our ___ Imam.",[T("1️⃣2️⃣","Twelfth"),T("1️⃣","First")],"Imam al-Mahdī (ʿaj) is the twelfth and last Imam.",MAHDI_REF,"He is the last Imam."),
  Q(["35"],"👨‍👦","Who is the father of Imam al-Mahdī (ʿaj)?",["Imam Ḥasan al-ʿAskarī (ʿa)","Imam ʿAlī al-Riḍā (ʿa)","Imam Jaʿfar al-Ṣādiq (ʿa)"],"Imam al-Mahdī (ʿaj) is the son of the eleventh Imam, Imam Ḥasan al-ʿAskarī (ʿa).",MAHDI_REF,"His father is the 11th Imam."),
  Q(["35"],"🏙️","In which city was Imam al-Mahdī (ʿaj) born?",["Sāmarrāʾ","Makkah","Najaf"],"Imam al-Mahdī (ʿaj) was born in Sāmarrāʾ, in Iraq.",MAHDI_REF,"It's the city where his father, Imam al-ʿAskarī (ʿa), lived."),
  Q(["35"],"🌫️","The time when Imam al-Mahdī (ʿaj) is hidden from people is called…",["Ghaybah (occultation)","Hijrah (migration)","Ḥajj (pilgrimage)"],"Ghaybah means being hidden. The Imam is alive, but Allah keeps him hidden from our eyes.",MAHDI_REF,"The Arabic word means “being absent” or “hidden”."),
  Q(["35"],"🏷️","Which of these is a title of Imam al-Mahdī (ʿaj)?",["Ṣāḥib al-Zamān (Master of the Age)","al-Kāẓim","al-Mujtabā"],"Imam al-Mahdī (ʿaj) is also called Ṣāḥib al-Zamān, al-Qāʾim and al-Ḥujjah.",MAHDI_REF,"The other two are titles of the 7th and 2nd Imams."),
  Q(["35"],"⏳","Waiting for the Imam (intiẓār) means…",["Trying to be a better person every day","Doing nothing until he comes","Only waiting at home"],"True waiting means getting ready: praying, learning and doing good deeds.",MAHDI_REF,"Waiting for a guest means getting the house ready."),
  Q(["35"],"📅","Which month comes right after Shaʿbān?",["Ramaḍān","Muḥarram","Rajab"],"Shaʿbān is the eighth month, and the blessed month of Ramaḍān comes next.","Qur'an 2:185","It's the month of fasting."),
  Q(["35"],"📛","Imam al-Mahdī (ʿaj) has the same name as the Prophet (ṣ). What is it?",["Muḥammad","ʿAlī","Ḥasan"],"His name is Muḥammad, the same as the Prophet (ṣ).",MAHDI_REF,"What is the Prophet's (ṣ) name?"),
  Q(["69"],"🗓️","In which year (AH) was Imam al-Mahdī (ʿaj) born?",["255 AH","260 AH","329 AH"],"He was born in 255 AH. He became Imam in 260 AH, when his father was martyred, and the Minor Occultation lasted until 329 AH.",MAHDI_REF,"He was a small child when he became Imam in 260 AH."),
  Q(["69"],"✉️","During the Minor Occultation (al-Ghaybah al-Ṣughrā), how did believers reach the Imam?",["Through four special deputies","By writing to the caliph","There was no way at all"],"For about 70 years, four special deputies carried letters and questions between the believers and the Imam. Then the Major Occultation began.",MAHDI_REF,"The deputies are called al-nuwwāb al-arbaʿah."),
  Q(["69"],"🧑‍🏫","During the Major Occultation, who do believers turn to for religious rulings?",["Qualified scholars (the marājiʿ)","Anyone popular online","No one; everyone decides alone"],"In the Major Occultation, believers follow qualified, just scholars for religious rulings.","Shaykh al-Ṣadūq, Kamāl al-Dīn (the Imam's letter about turning to the narrators of hadith)","Think of taqlīd."),
  Q(["69"],"🌅","Duʿā al-ʿAhd, often recited in the morning, is mainly about…",["Renewing our promise of loyalty to the Imam","Asking for rain","Thanking Allah for food"],"In Duʿā al-ʿAhd we renew our pledge to Imam al-Mahdī (ʿaj) and ask to be among his helpers.",MAFATIH,"ʿAhd means a promise or pledge."),
  Q(["69"],"🌱","Which choice best shows real intiẓār (waiting) for the Imam?",["Working on your character and helping others now","Waiting for others to fix the world","Only talking about when he will come"],"Waiting is active: we prepare ourselves and our communities by doing good.",MAHDI_REF,"Which one is active, not passive?"),
  Q(["69"],"⚖️","The Prophet (ṣ) said the Mahdī will fill the earth with justice after it has been filled with…",["Injustice and oppression","Water","Buildings"],"This hadith is narrated in many sources: the Mahdī will fill the earth with justice and fairness, as it was filled with injustice and oppression.",MAHDI_REF,"It's the opposite of justice.")
 ]});
